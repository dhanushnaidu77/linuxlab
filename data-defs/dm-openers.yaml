# Live mode: people who start DMs with you (one opener every 45-90 min per person).
# An opener is a string, or {q, a} where `a` is what a good answer covers (the persona uses it to judge your reply).
leo:
  - q: "hey, sorry if this is dumb 🙏 what's actually the difference between `kill` and `kill -9`? I always just use -9"
    a: "kill sends SIGTERM (15) by default: the process can catch it, clean up, flush, exit gracefully. -9 is SIGKILL: can't be caught, immediate, no cleanup (temp files, locks, half-written data). Try TERM first, KILL only if it ignores TERM."
  - q: "quick q — why does `cd` not work in a script? like I run ./go.sh which does cd /srv and I'm still in the same dir after 🤔"
    a: "A script runs in a child process; cd changes that child's working directory, which disappears when it exits. Parent shell is unaffected. Use `source ./go.sh` (or `. ./go.sh`) to run it in the current shell, or a shell function/alias."
  - q: "what does `2>&1` actually mean? I copy paste it everywhere lol"
    a: "File descriptors: 1 = stdout, 2 = stderr. 2>&1 redirects stderr to wherever stdout currently points. Order matters: `cmd > file 2>&1` sends both to file; `cmd 2>&1 > file` sends stderr to the terminal (old stdout)."
  - q: "is chmod 777 bad? someone told me never to do it but it fixes everything 😅"
    a: "777 = read/write/execute for everyone, so any user/process can modify or replace the file (e.g. a script that runs as root → privilege escalation). Fix the actual owner/group (chown/chgrp) and give the minimum mode (644 files, 755 dirs/scripts, 640/600 for secrets)."
  - q: "why does `ls -l` show a directory as 4096 bytes even when it has huge stuff inside?"
    a: "ls shows the size of the directory entry itself (its list of names, usually one 4K block), not its contents. Use `du -sh dir` for the total size of what's inside."
  - q: "what's the difference between a process and a service? like is nginx a process or a service"
    a: "A process is a running program instance (PID). A service is a managed definition (systemd unit) that starts/stops/restarts processes, runs them at boot, as a user, with logging. nginx the service (nginx.service) runs nginx processes (master + workers)."
  - q: "what's 127.0.0.1 vs 0.0.0.0? my app listens on 127.0.0.1 and nobody else can reach it"
    a: "127.0.0.1 is loopback: only reachable from the same machine. 0.0.0.0 as a listen address means all interfaces (reachable from the network, subject to firewall). To expose the app, bind 0.0.0.0 (or the specific interface IP)."
  - q: "how does DNS actually work when I type app01? like where does it look"
    a: "Resolver config: /etc/nsswitch.conf decides order (files then dns). 'files' = /etc/hosts. Then /etc/resolv.conf nameserver gets asked; the `search` domain turns app01 into app01.darkroom.internal. The DNS server (ns01) answers from its zone or recurses."
  - q: "what does sudo actually do? is it like logging in as root?"
    a: "sudo runs a single command as another user (root by default) after checking /etc/sudoers rules, usually with your own password, and logs it. It's not logging in as root; access can be limited to specific commands. `sudo -i`/`sudo su` gives a root shell (avoid when not needed)."
  - q: "the terminal said 'No space left on device' but df says 40% free?? 🤯"
    a: "Likely out of inodes (too many small files): check `df -i`. Other causes: the specific filesystem/mount being written to is full (not the one you looked at), or reserved blocks for root."
  - q: "what's the difference between `>` and `>>`?"
    a: "`>` truncates/overwrites the file then writes; `>>` appends to the end. Both create the file if missing."
  - q: "why do people use `ssh -J`? I just ssh twice"
    a: "-J (ProxyJump) connects to the target through a bastion in one command; the end-to-end session is encrypted to the target, keys/agent stay local, works with scp/rsync too, and you don't need keys stored on the jump host."
  - q: "what does `ps aux | grep python` actually show me? and why does grep show up in the results too"
    a: "ps aux lists every process (a = all users, u = user-oriented columns, x = include ones without a terminal): user, PID, %CPU, %MEM, start time, command. grep filters lines containing python; grep itself matches because its own command line contains 'python'. Use pgrep -a python or grep '[p]ython'."
  - q: "how do I check which process is using port 3000? my dev server says address already in use"
    a: "sudo ss -ltnp 'sport = :3000' (or ss -ltnp | grep 3000) shows the listening socket and the process/PID; alternatives lsof -i :3000, fuser 3000/tcp. Then decide whether to stop that process or use another port."
  - q: "how can I see how much RAM is free? top confuses me"
    a: "free -h: look at the 'available' column, not 'free' — Linux uses spare RAM as page cache which is reclaimable. top/htop for per-process usage (RES); vmstat 1 for trends; swap usage high = memory pressure."
  - q: "what does `tail -f` do? marcus told me to tail -f the logs"
    a: "Prints the last lines of a file and keeps following it, printing new lines as they're appended (live log watching). -n 100 for more history, -F to survive log rotation. For systemd services, journalctl -u <unit> -f is the equivalent."
  - q: "how do I check if a service is running? like is postgres up on db01"
    a: "systemctl status postgresql (active/running, recent logs) or systemctl is-active postgresql. Also check it's listening: ss -ltnp | grep 5432, and actually connect (pg_isready / psql). Running ≠ reachable."
  - q: "what does `chown -R` do and why did my teammate panic when I ran it on /"
    a: "chown changes owner (and group with user:group); -R recurses into everything below. On / it changes ownership of the entire system — sudo, ssh keys, setuid binaries, service files break; very hard to undo. Always double-check the path; never -R on system dirs."
  - q: "how do I find out what's eating disk space? the server is at 95%"
    a: "df -h to see which filesystem is full; then du -sh /path/* | sort -h (or du -xh --max-depth=1 /) to drill down, include dotfiles; ncdu is interactive. Common culprits: logs, docker images, old backups, core dumps; also deleted-but-open files (lsof +L1)."
  - q: "what does `curl -I` do? saw it in a runbook"
    a: "Sends a HEAD request and prints only the response headers (status code, server, content-type, cache headers, redirects) — quick way to check if a URL responds and what status it returns. -v shows the full request/response exchange; -L follows redirects."
  - q: "how do I check which version of something is installed? like openssl"
    a: "Ask the binary (openssl version) or the package manager: dpkg -l openssl / apt-cache policy openssl (installed vs candidate). Package version can differ from upstream because of backported fixes."
  - q: "what's `journalctl -xe`? it shows up in every error message"
    a: "journalctl shows systemd's logs; -e jumps to the end, -x adds explanatory help text for some messages. Usually better: journalctl -u <service> -n 50 (just that service) or -f to follow, --since '10 min ago', -p err for errors only."
  - q: "how can I check if I can reach a server on a port? like is db01:5432 open from here"
    a: "nc -zv db01 5432 (succeeded / refused / timeout), or bash /dev/tcp, telnet, curl for HTTP. Refused = host reachable but nothing listening (or REJECT); timeout = dropped by a firewall or no route. ping only tests ICMP, not the port."
  - q: "what does `find . -name '*.log' -mtime +7 -delete` do? scared to run it 😬"
    a: "Recursively from the current dir, finds names ending in .log modified more than 7 days ago, and deletes them. Good instinct: run it first without -delete (or with -print/-ls) to see what matches, and check you're in the right directory."
  - q: "how do I see who else is logged into the server?"
    a: "who or w (w also shows what they're running and idle time); last shows login history; ss -tnp state established '( sport = :22 )' shows ssh connections."
  - q: "what does `ip a` show? there's like lo, eth0 and a bunch of numbers"
    a: "All network interfaces and their addresses: lo is loopback (127.0.0.1); eth0 the real NIC with state UP/DOWN, MAC (link/ether), IPv4 'inet' with prefix (/24), IPv6. ip -br a gives a compact one-line-per-interface view; ip route shows routes."
