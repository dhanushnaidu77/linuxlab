server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name web01.darkroom.internal www.darkroom.internal;
    ssl_certificate     /etc/nginx/ssl/darkroom.crt;
    ssl_certificate_key /etc/nginx/ssl/darkroom.key;

    root /var/www/darkroom;
    index index.html;
    access_log /var/log/nginx/darkroom.access.log;
    error_log  /var/log/nginx/darkroom.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # resolve lazily so nginx starts even if DNS/app01 is down
    resolver 10.10.3.53 valid=30s;
    set $api_upstream app01.darkroom.internal:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
}
