id: schedule-cleanup
title: Schedule the temp cleanup script
skills: [cron]
difficulty: 1
channel: backend
persona: tom
targets: [app01]
vars: {}
message: |
  @dhan can you make /opt/darkroom/cleanup-tmp.sh on app01 run every 15 minutes? it should run as the darkroom user not root.
  thx!! 🙏
secret_context: |
  The script exists and works. Any of these is fine: darkroom's personal crontab (crontab -u darkroom -e) with */15,
  or a file in /etc/cron.d with the darkroom user field. Running as root is wrong.
hints:
  - "cron schedules have five time fields: minute hour day-of-month month day-of-week."
  - "Every 15 minutes = `*/15 * * * *`. Edit the darkroom user's crontab with `crontab -u darkroom -e`."
  - "(sudo crontab -u darkroom -l 2>/dev/null; echo '*/15 * * * * /opt/darkroom/cleanup-tmp.sh') | sudo crontab -u darkroom -"
