# Habit drills: counting files and lines, finding things, moving things around.
# Each setup randomizes its data, so repeats have different answers.

- id: d-count-csv
  skill: files
  difficulty: 1
  persona: ana
  channel: data
  host: app01
  title: How many CSV exports today?
  message: "@dhan quick one: how many .csv files are in /srv/exports/today on app01? (just .csv, not the .gz or .tmp ones)"
  setup: |
    rm -rf /srv/exports/today && mkdir -p /srv/exports/today
    for i in $(seq $((RANDOM % 20 + 8))); do touch /srv/exports/today/export-$i.csv; done
    for i in $(seq $((RANDOM % 6 + 2))); do touch /srv/exports/today/old-$i.csv.gz /srv/exports/today/part-$i.tmp; done
    mkdir -p /srv/exports/today/archive.csv
  expect: "find /srv/exports/today -maxdepth 1 -type f -name '*.csv' | wc -l"
  answer: number
  extract: "the number of csv files"
  hints:
    - "List the directory filtered by the extension, then count the lines."
    - "`ls *.csv | wc -l` works, but `find -maxdepth 1 -type f -name '*.csv'` is safer (a directory is also named *.csv!)."
    - "find /srv/exports/today -maxdepth 1 -type f -name '*.csv' | wc -l"
  solution: |
    ```bash
    find /srv/exports/today -maxdepth 1 -type f -name '*.csv' | wc -l
    ```
    `ls *.csv | wc -l` would also count the directory `archive.csv/` — `-type f` restricts to regular files.
    `*.csv` doesn't match `*.csv.gz` because the glob must match to the end of the name.

- id: d-count-files-recursive
  skill: files
  difficulty: 1
  persona: priya
  channel: platform
  host: app01
  title: How many files in the media library?
  message: "hi @dhan! for the storage quote: how many files total are in /srv/media on app01, including all the subfolders? 🙏"
  setup: |
    rm -rf /srv/media && mkdir -p /srv/media
    for d in images video docs images/2025 images/2026 video/raw docs/legal; do
      mkdir -p /srv/media/$d
      for i in $(seq $((RANDOM % 15 + 1))); do head -c $((RANDOM % 2000)) /dev/urandom > /srv/media/$d/item-$i.bin; done
    done
  expect: "find /srv/media -type f | wc -l"
  answer: number
  extract: "the number of files"
  hints:
    - "You need a recursive listing of regular files only (not directories), then a count."
    - "`find <dir> -type f` walks all subdirectories; pipe it to `wc -l`."
    - "find /srv/media -type f | wc -l"
  solution: |
    ```bash
    find /srv/media -type f | wc -l
    ```
    `ls -R` output includes directory headers and blank lines, so counting it is wrong. `find -type d` would count folders.

