- id: d-biggest-media
  skill: files
  difficulty: 2
  persona: ana
  channel: data
  host: app01
  title: Biggest file anywhere under /srv/media
  message: "@dhan which file is the biggest anywhere under /srv/media on app01 (any subfolder)? name is enough"
  setup: |
    rm -rf /srv/media && mkdir -p /srv/media/{a,b,c/d,e/f/g}
    for d in a b c/d e/f/g; do for i in 1 2 3 4; do head -c $((RANDOM % 800 + 10))K /dev/urandom > /srv/media/$d/clip-${d//\//-}-$i.mp4; done; done
    dirs=(a b c/d e/f/g); d=${dirs[$((RANDOM % 4))]}
    head -c 1500K /dev/urandom > /srv/media/$d/master-$RANDOM.mov
  expect: "find /srv/media -type f -printf '%s %f\\n' | sort -n | tail -1 | cut -d' ' -f2"
  answer: regex
  extract: "the file name"
  secret: "The biggest file is named {{EXPECT}}."
  hints:
    - "You need sizes of files in all subdirectories, sorted."
    - "`find -type f -printf '%s %p\\n' | sort -n | tail -1`, or `du -a | sort -n | tail`."
    - "find /srv/media -type f -printf '%s %p\\n' | sort -n | tail -1"
  solution: |
    ```bash
    find /srv/media -type f -printf '%s %p\n' | sort -n | tail -1
    du -ah /srv/media | sort -h | tail -3            # du counts disk blocks, close enough usually
    ls -lSR /srv/media | head                        # -S sorts, but per directory only
    ```

