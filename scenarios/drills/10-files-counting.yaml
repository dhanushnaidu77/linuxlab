- id: d-count-hidden
  skill: files
  difficulty: 1
  persona: sam
  channel: platform
  host: jump01
  title: Hidden files in the shared scratch dir
  message: "@dhan how many HIDDEN files (dotfiles) are in /srv/scratch on jump01? someone's been stashing stuff."
  setup: |
    rm -rf /srv/scratch && mkdir -p /srv/scratch
    for i in $(seq $((RANDOM % 8 + 2))); do touch /srv/scratch/.stash-$i; done
    for i in $(seq $((RANDOM % 10 + 5))); do touch /srv/scratch/visible-$i.txt; done
  expect: "find /srv/scratch -maxdepth 1 -type f -name '.*' | wc -l"
  answer: number
  extract: "the number of hidden files"
  hints:
    - "Plain `ls` hides files starting with a dot."
    - "`ls -A` shows them (without . and ..); or find with -name '.*'."
    - "find /srv/scratch -maxdepth 1 -type f -name '.*' | wc -l"
  solution: |
    ```bash
    ls -A /srv/scratch | grep '^\.' | wc -l
    find /srv/scratch -maxdepth 1 -type f -name '.*' | wc -l
    ```
    `ls -a` also lists `.` and `..`; `-A` ("almost all") doesn't.

- id: d-csv-rows
  skill: text-processing
  difficulty: 1
  persona: ana
  channel: data
  host: app01
  title: How many customer rows?
  message: "@dhan how many customers are in /srv/data/customers.csv on app01? (rows, the header doesn't count)"
  setup: |
    mkdir -p /srv/data; f=/srv/data/customers.csv
    echo "id,name,email,country" > $f
    for i in $(seq $((RANDOM % 900 + 100))); do echo "$i,cust$i,c$i@example.com,XX" >> $f; done
  expect: "echo $(( $(wc -l < /srv/data/customers.csv) - 1 ))"
  answer: number
  extract: "the number of rows"
  hints:
    - "Count the lines, then account for the header."
    - "`wc -l < file` prints just the number. Or skip the header with `tail -n +2`."
    - "tail -n +2 /srv/data/customers.csv | wc -l"
  solution: |
    ```bash
    tail -n +2 /srv/data/customers.csv | wc -l     # +2 = start from line 2
    echo $(( $(wc -l < /srv/data/customers.csv) - 1 ))
    ```
    `wc -l file` prints "N file"; `wc -l < file` prints just N (handy in scripts).

