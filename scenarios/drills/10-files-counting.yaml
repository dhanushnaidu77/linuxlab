- id: d-clean-old-tmp
  skill: files
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: Clean up old cache files (carefully)
  message: "@dhan delete the .tmp files older than 7 days in /srv/cache on app01. ONLY those. newer .tmp and everything else stays."
  setup: |
    rm -rf /srv/cache && mkdir -p /srv/cache/sub
    for i in $(seq 8); do f=/srv/cache/old-$i.tmp; touch $f; touch -d "-$((RANDOM % 20 + 8)) days" $f; done
    for i in $(seq 3); do f=/srv/cache/sub/old-sub-$i.tmp; touch $f; touch -d "-15 days" $f; done
    for i in $(seq 5); do f=/srv/cache/new-$i.tmp; touch $f; touch -d "-$((RANDOM % 5 + 1)) days" $f; done
    for i in $(seq 4); do f=/srv/cache/keep-$i.dat; touch $f; touch -d "-30 days" $f; done
  checks:
    - ["[ -z \"$(find /srv/cache -name '*.tmp' -mtime +7)\" ]", "there are still .tmp files older than 7 days in /srv/cache"]
    - ["[ $(find /srv/cache -name 'new-*.tmp' | wc -l) -eq 5 ]", "you deleted recent .tmp files too!"]
    - ["[ $(find /srv/cache -name 'keep-*.dat' | wc -l) -eq 4 ]", "the .dat files are gone — I said ONLY old .tmp files"]
  solve: "find /srv/cache -name '*.tmp' -mtime +7 -delete"
  hints:
    - "find can combine a name pattern and an age test, and delete what it finds."
    - "Run it first WITHOUT -delete to see what matches. `-mtime +7` = older than 7 days."
    - "find /srv/cache -name '*.tmp' -mtime +7 -print   then the same with -delete"
  solution: |
    ```bash
    find /srv/cache -name '*.tmp' -mtime +7 -print     # dry run first!
    find /srv/cache -name '*.tmp' -mtime +7 -delete
    ```
    Put `-delete` last — find evaluates left to right, and `-delete` before the tests would delete everything.

- id: d-rename-jpeg
  skill: files
  difficulty: 2
  persona: priya
  channel: platform
  host: web01
  title: Rename .jpeg files to .jpg
  message: "hi @dhan, the new CMS only accepts .jpg 😅 can you rename every .jpeg in /var/www/darkroom/img on web01 to .jpg? same names otherwise 🙏"
  setup: |
    rm -rf /var/www/darkroom/img && mkdir -p /var/www/darkroom/img
    for i in $(seq $((RANDOM % 10 + 5))); do echo img > "/var/www/darkroom/img/photo-$i.jpeg"; done
    echo img > /var/www/darkroom/img/logo.png; echo img > /var/www/darkroom/img/banner.jpg
  checks:
    - ["[ $(ls /var/www/darkroom/img | grep -c '\\.jpeg$') -eq 0 ]", "there are still .jpeg files"]
    - ["ls /var/www/darkroom/img/photo-1.jpg /var/www/darkroom/img/banner.jpg /var/www/darkroom/img/logo.png", "some files are missing or got the wrong name"]
  solve: "cd /var/www/darkroom/img && for f in *.jpeg; do mv -- \"$f\" \"${f%.jpeg}.jpg\"; done"
  hints:
    - "Loop over the files and rename each one."
    - "In bash, `${f%.jpeg}` strips the suffix from a variable."
    - "for f in *.jpeg; do mv -- \"$f\" \"${f%.jpeg}.jpg\"; done"
  solution: |
    ```bash
    cd /var/www/darkroom/img
    for f in *.jpeg; do mv -- "$f" "${f%.jpeg}.jpg"; done
    ```
    `${var%pattern}` removes the shortest match from the end; `${var#pattern}` from the start.
    Alternative: `rename 's/\.jpeg$/.jpg/' *.jpeg` (perl rename, if installed).

