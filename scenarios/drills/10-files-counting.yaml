    echo txt > /srv/inbox/notes.txt
  checks:
    - ["[ -d /srv/archive/pdf ] && [ $(ls /srv/archive/pdf/*.pdf | wc -l) -ge 3 ]", "I don't see the PDFs in /srv/archive/pdf"]
    - ["! ls /srv/inbox/*.pdf", "there are still PDFs left in /srv/inbox"]
    - ["test -f /srv/inbox/notes.txt", "notes.txt was moved/deleted too — only the PDFs please"]
  solve: "mkdir -p /srv/archive/pdf && mv /srv/inbox/*.pdf /srv/archive/pdf/"
  hints:
    - "Make sure the destination exists first, then move with a wildcard."
    - "`mkdir -p` creates parents and doesn't complain if it exists."
    - "mkdir -p /srv/archive/pdf && mv /srv/inbox/*.pdf /srv/archive/pdf/"
  solution: |
    ```bash
    sudo mkdir -p /srv/archive/pdf
    sudo mv /srv/inbox/*.pdf /srv/archive/pdf/
    ```
    Trailing `/` on the destination makes mv fail loudly if it isn't a directory (instead of renaming).

- id: d-make-symlink
  skill: files
  difficulty: 1
  persona: tom
  channel: backend
  host: app01
  title: Put drctl on the PATH
  message: "can you make `drctl` runnable from anywhere on app01? the binary is /opt/darkroom/bin/drctl-2.3. a symlink in /usr/local/bin called drctl pls"
  setup: |
    mkdir -p /opt/darkroom/bin; rm -f /usr/local/bin/drctl
    printf '#!/bin/bash\necho "drctl 2.3"\n' > /opt/darkroom/bin/drctl-2.3; chmod 755 /opt/darkroom/bin/drctl-2.3
  checks:
    - ["test -L /usr/local/bin/drctl", "/usr/local/bin/drctl isn't a symlink"]
    - ["[ \"$(readlink -f /usr/local/bin/drctl)\" = /opt/darkroom/bin/drctl-2.3 ]", "the symlink doesn't point at /opt/darkroom/bin/drctl-2.3"]
    - ["drctl | grep -q 2.3", "running `drctl` doesn't work"]
  solve: "ln -s /opt/darkroom/bin/drctl-2.3 /usr/local/bin/drctl"
  hints:
    - "A symbolic link is created with `ln` and a specific flag."
    - "Order is `ln -s TARGET LINK_NAME` — target first."
    - "sudo ln -s /opt/darkroom/bin/drctl-2.3 /usr/local/bin/drctl"
  solution: |
    ```bash
    sudo ln -s /opt/darkroom/bin/drctl-2.3 /usr/local/bin/drctl
    ls -l /usr/local/bin/drctl && drctl
    ```
    Mnemonic: `ln -s` works like `cp` — source first, then the new name.

- id: d-copy-preserve
  skill: files
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: Back up a config, keeping its timestamps
  message: "@dhan before we touch it: copy /etc/darkroom/api.conf to /root/backups/api.conf on app01. keep the original timestamps and permissions — I want to know when it was last changed."
  setup: |
    rm -rf /root/backups; touch -d '2026-09-03 14:22' /etc/darkroom/api.conf
  checks:
    - ["cmp /etc/darkroom/api.conf /root/backups/api.conf", "/root/backups/api.conf doesn't exist or differs"]
    - ["[ $(stat -c %Y /etc/darkroom/api.conf) = $(stat -c %Y /root/backups/api.conf) ]", "the copy got a new modification time — the timestamp is lost"]
    - ["[ $(stat -c %a /etc/darkroom/api.conf) = $(stat -c %a /root/backups/api.conf) ]", "the copy has different permissions"]
  solve: "mkdir -p /root/backups && cp -p /etc/darkroom/api.conf /root/backups/api.conf"
  hints:
    - "Plain cp gives the new file the current time."
    - "cp has a flag to preserve mode, ownership and timestamps (and `-a` for archives)."
    - "sudo mkdir -p /root/backups && sudo cp -p /etc/darkroom/api.conf /root/backups/"
  solution: |
    ```bash
    sudo mkdir -p /root/backups
    sudo cp -p /etc/darkroom/api.conf /root/backups/      # -p: mode, ownership, timestamps
    sudo stat -c '%y %n' /etc/darkroom/api.conf /root/backups/api.conf
    ```
    `cp -a` = `-dR --preserve=all` — the right choice for copying whole directory trees.

- id: d-make-tarball
  skill: files
  difficulty: 2
  persona: ana
  channel: data
  host: app01
  title: Tarball of the batch logs
  message: "@dhan can you pack all the .log files from /var/log/darkroom/batch into /srv/backups/batch-logs.tar.gz on app01? I need to send them to a vendor"
  setup: |
    rm -rf /var/log/darkroom/batch /srv/backups/batch-logs.tar.gz && mkdir -p /var/log/darkroom/batch /srv/backups
    for j in $(seq $((RANDOM % 4 + 2))); do echo "job $j" > /var/log/darkroom/batch/job-$j.log; done
  checks:
    - ["gzip -t /srv/backups/batch-logs.tar.gz", "/srv/backups/batch-logs.tar.gz doesn't exist or isn't a valid gzip"]
    - ["[ $(tar tzf /srv/backups/batch-logs.tar.gz | grep -c 'job-.*\\.log$') -eq $(ls /var/log/darkroom/batch/*.log | wc -l) ]", "the tarball doesn't contain all the .log files"]
  solve: "tar czf /srv/backups/batch-logs.tar.gz -C /var/log/darkroom/batch $(cd /var/log/darkroom/batch && ls *.log)"
  hints:
    - "tar creates archives; z adds gzip compression."
    - "`tar czf OUTPUT.tar.gz FILES...` — c create, z gzip, f file. `tar tzf` lists to verify."
    - "sudo tar czf /srv/backups/batch-logs.tar.gz -C /var/log/darkroom/batch ."
  solution: |
    ```bash
    sudo tar czf /srv/backups/batch-logs.tar.gz -C /var/log/darkroom/batch .
    tar tzf /srv/backups/batch-logs.tar.gz            # verify
    ```
    `-C dir` makes paths inside the archive relative to that dir (no `var/log/...` prefix).
