- id: d-files-over-1m
  skill: files
  difficulty: 2
  persona: ana
  channel: data
  host: app01
  title: How many files over 1 MB?
  message: "@dhan how many files under /srv/datasets on app01 are bigger than 1 MB?"
  setup: |
    rm -rf /srv/datasets && mkdir -p /srv/datasets/{raw,clean}
    for i in $(seq $((RANDOM % 6 + 2))); do head -c $((RANDOM % 900 + 1100))K /dev/zero > /srv/datasets/raw/big-$i.parquet; done
    for i in $(seq $((RANDOM % 10 + 5))); do head -c $((RANDOM % 900 + 1))K /dev/zero > /srv/datasets/clean/small-$i.parquet; done
  expect: "find /srv/datasets -type f -size +1M | wc -l"
