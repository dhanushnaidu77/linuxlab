- id: d-first-error-time
  skill: logs
  difficulty: 1
  persona: marcus
  channel: platform
  host: app01
  title: When was the first error?
  message: "@dhan what time (HH:MM:SS) is the FIRST ERROR line in /var/log/darkroom/sync.log on app01?"
  setup: |
    f=/var/log/darkroom/sync.log; : > $f; e=$((RANDOM % 200 + 20))
    for i in $(seq 300); do t=$(printf '%02d:%02d:%02d' $((8 + i/60)) $((i%60)) $((RANDOM%60))); if [ $i -ge $e ] && [ $((RANDOM%4)) = 0 ]; then echo "2026-10-16 $t ERROR sync failed"; else echo "2026-10-16 $t INFO synced"; fi; done >> $f
  expect: "grep -m1 ERROR /var/log/darkroom/sync.log | awk '{print $2}'"
  answer: exact
  extract: "the time HH:MM:SS"
  hints:
    - "Find the first matching line only."
    - "`grep -m1` stops after the first match; `head -1` after a grep also works. Then take the time field."
    - "grep -m1 ERROR /var/log/darkroom/sync.log"
  solution: |
    ```bash
    grep -m1 ERROR /var/log/darkroom/sync.log | awk '{print $2}'
    grep ERROR /var/log/darkroom/sync.log | tail -1     # the LAST one
    ```

- id: d-bash-users
  skill: users
  difficulty: 1
  persona: sam
  channel: platform
  host: app01
  title: Accounts with a real shell
  message: "@dhan how many accounts on app01 have /bin/bash as their login shell?"
  expect: "grep -c '/bin/bash$' /etc/passwd"
  answer: number
  extract: "the number of accounts"
  setup: |
    for u in svc-a svc-b; do id $u >/dev/null 2>&1 || useradd -r -s /usr/sbin/nologin $u; done
  hints:
    - "/etc/passwd has one line per account; the last field is the shell."
    - "Count lines ending in /bin/bash."
    - "grep -c '/bin/bash$' /etc/passwd"
  solution: |
    ```bash
    grep -c '/bin/bash$' /etc/passwd
    awk -F: '$7 == "/bin/bash" {print $1}' /etc/passwd      # names
    getent passwd | grep bash                               # includes LDAP etc. if configured
    ```

- id: d-grep-config-ip
  skill: text-processing
  difficulty: 1
  persona: leah
  channel: netops
  host: rtr01
  title: Which route file mentions an IP?
  vars:
    IP: { pick: [10.10.3.77, 10.10.2.250, 10.10.9.14] }
  message: "@dhan which file in /etc/darkroom/routes on rtr01 still references {{IP}}? (file name)"
  setup: |
    rm -rf /etc/darkroom/routes && mkdir -p /etc/darkroom/routes
    names=(office dmz backend vpn lab guest legacy partner); hit=${names[$((RANDOM % 8))]}
    for n in "${names[@]}"; do printf 'via 10.10.1.1\nnet 10.10.%d.0/24\n' $((RANDOM % 9)) > /etc/darkroom/routes/$n.route; done
    echo "host $IP" >> /etc/darkroom/routes/$hit.route
  expect: "grep -lF \"$IP\" /etc/darkroom/routes/* | xargs -n1 basename"
  answer: regex
  extract: "the file name"
  hints:
    - "Search all files for the address, print only the file names."
    - "`grep -l`, and `-F` to treat dots literally (fixed string)."
    - "grep -lF '{{IP}}' /etc/darkroom/routes/*"
  solution: |
    ```bash
    grep -lF '{{IP}}' /etc/darkroom/routes/*
    ```
    `-F` = fixed string: no regex, so `.` is a literal dot.

