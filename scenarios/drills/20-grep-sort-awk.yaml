  channel: data
  host: app01
  title: Log lines from one day
  vars:
    DAY: { pick: ["2026-10-12", "2026-10-13", "2026-10-14"] }
  message: "@dhan how many lines in /var/log/darkroom/etl.log on app01 are from {{DAY}}?"
  setup: |
    f=/var/log/darkroom/etl.log; : > $f
    for i in $(seq 700); do echo "2026-10-1$((RANDOM % 5 + 1)) 0$((RANDOM%9)):00:00 etl batch $i"; done | sort >> $f
  expect: "grep -c \"^$DAY \" /var/log/darkroom/etl.log"
  answer: number
  extract: "the number of lines"
  hints:
    - "The date is at the start of each line."
    - "`grep -c '^DATE '`"
    - "grep -c '^{{DAY}} ' /var/log/darkroom/etl.log"
  solution: |
    ```bash
    grep -c '^{{DAY}} ' /var/log/darkroom/etl.log
    cut -d' ' -f1 /var/log/darkroom/etl.log | uniq -c       # lines per day (file is sorted)
    ```

- id: d-refund-total
  skill: text-processing
  difficulty: 2
  persona: ana
  channel: data
  host: app01
  title: Total of refunded orders
  message: "@dhan sum of the amount column for orders with status 'refunded' in /srv/data/orders.csv on app01? (whole dollars)"
  setup: |
    f=/srv/data/orders.csv; mkdir -p /srv/data; echo "order_id,customer,amount,status" > $f
    for i in $(seq 500); do echo "$i,c$((RANDOM%80)),$((RANDOM % 500 + 5)),$(shuf -n1 -e paid paid paid pending refunded)" >> $f; done
  expect: "awk -F, '$4 == \"refunded\" {s += $3} END {print s}' /srv/data/orders.csv"
  answer: number
  extract: "the total"
  hints:
    - "Filter rows by one column, sum another."
    - "`awk -F, '$4 == \"refunded\" {s += $3} END {print s}'`"
    - "awk -F, '$4==\"refunded\" {s+=$3} END {print s}' /srv/data/orders.csv"
  solution: |
    ```bash
    awk -F, '$4 == "refunded" {s += $3} END {print s}' /srv/data/orders.csv
    awk -F, 'NR>1 {s[$4] += $3} END {for (k in s) print k, s[k]}' /srv/data/orders.csv     # all statuses
    ```

- id: d-earliest-hire
  skill: text-processing
  difficulty: 2
  persona: raj
  channel: it-helpdesk
  host: app01
  title: Longest-serving employee
  message: "Hi @dhan, who has the earliest start date in /srv/data/hires.csv on app01? (name please, it's for an anniversary gift 🎁)"
  setup: |
    f=/srv/data/hires.csv; mkdir -p /srv/data; echo "name,team,start_date" > $f
    for i in $(seq 60); do echo "person$i,team$((RANDOM%5)),20$((RANDOM % 6 + 19))-$(printf %02d $((RANDOM%12+1)))-$(printf %02d $((RANDOM%28+1)))" >> $f; done
    echo "veteran$RANDOM,ops,2014-03-0$((RANDOM%9+1))" >> $f
  expect: "tail -n +2 /srv/data/hires.csv | sort -t, -k3 | head -1 | cut -d, -f1"
  answer: exact
  extract: "the person's name"
  hints:
    - "Sort the rows by the date column. ISO dates (YYYY-MM-DD) sort correctly as text."
    - "`sort -t, -k3` sorts by the 3rd comma-separated field."
    - "tail -n +2 /srv/data/hires.csv | sort -t, -k3 | head -1"
  solution: |
    ```bash
    tail -n +2 /srv/data/hires.csv | sort -t, -k3 | head -1
    ```
    `-t,` sets the field separator, `-k3` the key. `-k3,3` limits the key to just field 3.

- id: d-duplicate-lines
