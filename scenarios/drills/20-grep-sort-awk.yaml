- id: d-count-404
  skill: text-processing
  difficulty: 2
  persona: priya
  channel: platform
  host: web01
  title: How many 404s?
  message: "hi @dhan! how many 404 (not found) responses are in /var/log/nginx/access-today.log on web01? the client says links are broken 😬"
  setup: |
    f=/var/log/nginx/access-today.log; : > $f
    for i in $(seq 800); do s=$(shuf -n1 -e 200 200 200 200 301 404 500); echo "10.10.1.$((RANDOM%50)) - - [16/Oct/2026:11:00:00 +0000] \"GET /page/404-$i HTTP/1.1\" $s $((RANDOM%9000))"; done >> $f
  expect: "awk '$9 == 404' /var/log/nginx/access-today.log | wc -l"
  answer: number
  extract: "the number of 404 responses"
  secret: "Watch out: some URLs contain '404' in the path, so a plain grep 404 over-counts. The answer is {{EXPECT}}."
  hints:
    - "Careful: '404' also appears inside some URLs. Match the status code field specifically."
    - "In nginx's log format the status is field 9: `awk '$9 == 404'`."
    - "awk '$9 == 404' /var/log/nginx/access-today.log | wc -l"
  solution: |
    ```bash
    awk '$9 == 404' /var/log/nginx/access-today.log | wc -l
    awk '{print $9}' /var/log/nginx/access-today.log | sort | uniq -c | sort -rn     # all statuses
    ```
    `grep -c 404` would also count `GET /page/404-...` lines.

- id: d-top-url
  skill: text-processing
  difficulty: 2
  persona: priya
  channel: platform
  host: web01
  title: Most requested page
  message: "@dhan what's the most requested URL path in /var/log/nginx/access-today.log on web01? marketing wants to know 📈"
  setup: |
    f=/var/log/nginx/access-today.log; : > $f
    paths=(/ /pricing /docs /blog /login /api/health /careers /about); top=${paths[$((RANDOM % 8))]}
    for i in $(seq 900); do p=${paths[$((RANDOM % 8))]}; [ $((RANDOM % 4)) = 0 ] && p=$top; echo "10.10.1.$((RANDOM%60)) - - [16/Oct/2026:12:00:00 +0000] \"GET $p HTTP/1.1\" 200 100"; done >> $f
  expect: "awk '{print $7}' /var/log/nginx/access-today.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}'"
  answer: exact
  extract: "the URL path"
  hints:
    - "Pull out the path column, count each distinct value, sort by count."
    - "The path is field 7. Pipeline: awk → sort → uniq -c → sort -rn → head."
    - "awk '{print $7}' /var/log/nginx/access-today.log | sort | uniq -c | sort -rn | head -3"
  solution: |
    ```bash
    awk '{print $7}' /var/log/nginx/access-today.log | sort | uniq -c | sort -rn | head
    ```
    This "field → sort → uniq -c → sort -rn" pipeline answers half of all log questions.

