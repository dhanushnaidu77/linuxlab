  message: "@dhan /srv/data/invoice-ids.txt on app01 should have unique ids but doesn't. how many ids appear MORE than once?"
  setup: |
    f=/srv/data/invoice-ids.txt; mkdir -p /srv/data; : > $f
    for i in $(seq 300); do echo "INV-$((RANDOM % 280 + 1000))"; done | shuf > $f
  expect: "sort /srv/data/invoice-ids.txt | uniq -d | wc -l"
  answer: number
  extract: "the number of duplicated ids"
  hints:
    - "uniq only works on adjacent lines, and it has a mode for duplicates."
    - "`sort | uniq -d` prints one copy of each duplicated line."
    - "sort /srv/data/invoice-ids.txt | uniq -d | wc -l"
  solution: |
    ```bash
    sort /srv/data/invoice-ids.txt | uniq -d | wc -l      # ids that are duplicated
