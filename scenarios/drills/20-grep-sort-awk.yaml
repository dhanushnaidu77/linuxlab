- id: d-csv-columns
  skill: text-processing
  difficulty: 1
  persona: ana
  channel: data
  host: app01
  title: How many columns?
  message: "@dhan how many columns does /srv/data/wide-export.csv on app01 have?"
  setup: |
    f=/srv/data/wide-export.csv; mkdir -p /srv/data; n=$((RANDOM % 30 + 8))
    seq -s, -f 'col%g' $n > $f; for i in $(seq 20); do seq -s, $n >> $f; done
  expect: "head -1 /srv/data/wide-export.csv | awk -F, '{print NF}'"
  answer: number
  extract: "the number of columns"
  hints:
    - "Look at the header line and count the fields."
    - "awk's NF is the number of fields on the line."
    - "head -1 /srv/data/wide-export.csv | awk -F, '{print NF}'"
  solution: |
    ```bash
    head -1 /srv/data/wide-export.csv | awk -F, '{print NF}'
    head -1 /srv/data/wide-export.csv | tr ',' '\n' | wc -l
    head -1 /srv/data/wide-export.csv | tr ',' '\n' | cat -n      # numbered column names
    ```

- id: d-unique-hosts-ci
  skill: text-processing
  difficulty: 2
  persona: leah
  channel: netops
  host: app01
  title: Distinct hostnames (case-insensitive)
  message: "@dhan /srv/data/inventory.txt on app01 has one hostname per line but people typed them in random case (App01, APP01…). how many distinct hosts really?"
  setup: |
    f=/srv/data/inventory.txt; mkdir -p /srv/data; : > $f; n=$((RANDOM % 15 + 5))
    for i in $(seq 120); do h="node$((RANDOM % n))"; case $((RANDOM % 3)) in 0) echo "$h";; 1) echo "${h^^}";; 2) echo "${h^}";; esac; done >> $f
  expect: "tr '[:upper:]' '[:lower:]' < /srv/data/inventory.txt | sort -u | wc -l"
  answer: number
  extract: "the number of distinct hosts"
  hints:
    - "Normalize the case first, then deduplicate."
    - "`tr '[:upper:]' '[:lower:]'` lowercases; or `sort -fu` (fold case)."
    - "tr A-Z a-z < /srv/data/inventory.txt | sort -u | wc -l"
  solution: |
    ```bash
    tr '[:upper:]' '[:lower:]' < /srv/data/inventory.txt | sort -u | wc -l
    sort -fu /srv/data/inventory.txt | wc -l
    ```

