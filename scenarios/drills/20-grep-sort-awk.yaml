- id: d-sed-replace-one
  skill: text-processing
  difficulty: 1
  persona: tom
  channel: backend
  host: app01
  title: Flip a config value
  message: "can you change `debug = true` to `debug = false` in /etc/darkroom/app.ini on app01? nothing else pls"
  setup: |
    printf '[app]\nname = darkroom\ndebug = true\nworkers = 4\n# debug = true was set for incident 42\n' > /etc/darkroom/app.ini
  checks:
    - ["grep -qx 'debug = false' /etc/darkroom/app.ini", "debug isn't false yet"]
    - ["! grep -qx 'debug = true' /etc/darkroom/app.ini", "there's still an active 'debug = true' line"]
    - ["grep -q '^# debug = true was set' /etc/darkroom/app.ini && grep -qx 'workers = 4' /etc/darkroom/app.ini", "other lines (like the comment) got changed too"]
  solve: "sed -i 's/^debug = true$/debug = false/' /etc/darkroom/app.ini"
  hints:
    - "sed can edit a file in place."
    - "Anchor the pattern so the comment line doesn't change: `^debug = true$`."
    - "sudo sed -i 's/^debug = true$/debug = false/' /etc/darkroom/app.ini"
  solution: |
    ```bash
    sudo sed -i 's/^debug = true$/debug = false/' /etc/darkroom/app.ini
    grep -n debug /etc/darkroom/app.ini
    ```
    Without `^`, the comment `# debug = true was set...` would be edited too.

- id: d-tail-errors-live
