# Habit drills: grep / sort / uniq / awk / cut / sed -n / head / tail on randomized logs and CSVs.

- id: d-grep-count-ip
  skill: text-processing
  difficulty: 1
  persona: leah
  channel: netops
  host: web01
  title: Requests from one IP
  vars:
    IP: { pick: [10.10.1.10, 10.10.3.10, 10.10.2.77, 10.10.1.42] }
  message: "@dhan how many requests did {{IP}} make according to /var/log/nginx/access-today.log on web01?"
  setup: |
    f=/var/log/nginx/access-today.log; : > $f
    ips=(10.10.1.10 10.10.3.10 10.10.2.77 10.10.1.42 10.10.1.4 10.10.3.100 10.10.1.104)
    for i in $(seq 900); do echo "${ips[$((RANDOM % 7))]} - - [16/Oct/2026:10:$((RANDOM%60)):00 +0000] \"GET /p/$i HTTP/1.1\" 200 512 \"-\" \"curl\""; done >> $f
  expect: "grep -c \"^$IP \" /var/log/nginx/access-today.log"
  answer: number
  extract: "the number of requests"
  hints:
    - "Each line starts with the client IP. Count matching lines."
    - "`grep -c` counts matching lines — anchor with ^ and a trailing space, or 10.10.1.10 also matches 10.10.1.104!"
    - "grep -c '^{{IP}} ' /var/log/nginx/access-today.log"
  solution: |
    ```bash
    grep -c '^{{IP}} ' /var/log/nginx/access-today.log
    awk '$1 == "{{IP}}"' /var/log/nginx/access-today.log | wc -l     # exact field match
    ```
    Unanchored `grep -c {{IP}}` can over-count: dots match any character and `10.10.1.10` is a prefix of `10.10.1.104`.

- id: d-grep-ci
  skill: text-processing
  difficulty: 1
  persona: tom
  channel: backend
  host: app01
  title: Warnings in any case
  message: "how many lines in /var/log/darkroom/build.log on app01 mention 'warning'? they spell it WARNING, Warning, warning… all of them count"
  setup: |
    f=/var/log/darkroom/build.log; : > $f
    for i in $(seq 500); do case $((RANDOM % 8)) in 0) echo "step $i: WARNING deprecated flag";; 1) echo "step $i: Warning: unused var";; 2) echo "step $i: compiler warning W$RANDOM";; *) echo "step $i: ok";; esac >> $f; done
  expect: "grep -ci warning /var/log/darkroom/build.log"
  answer: number
  extract: "the number of lines"
  hints:
    - "grep is case-sensitive by default."
    - "`-i` ignores case; `-c` counts lines."
    - "grep -ci warning /var/log/darkroom/build.log"
  solution: |
    ```bash
    grep -ci warning /var/log/darkroom/build.log
    ```

- id: d-grep-active-config
  skill: text-processing
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: How many settings are actually active?
  message: "@dhan /etc/darkroom/worker.ini on app01 is 90% comments and blank lines. how many lines are actual settings?"
  setup: |
    f=/etc/darkroom/worker.ini; : > $f
    for i in $(seq 120); do case $((RANDOM % 5)) in 0) echo "# comment about option $i";; 1) echo "";; 2) echo "   # indented comment";; 3) echo "option_$i = $RANDOM";; 4) echo "; ini-style comment $i";; esac >> $f; done
  expect: "grep -vcE '^[[:space:]]*([#;]|$)' /etc/darkroom/worker.ini"
  answer: number
  extract: "the number of setting lines"
  secret: "Comments start with # or ; (possibly indented). The answer is {{EXPECT}}."
  hints:
    - "Invert the match: count lines that are NOT comments and NOT empty. Look at what comment characters this file uses."
    - "`grep -v` inverts; `-E` for alternation. Comments here start with # or ; (sometimes indented)."
    - "grep -vcE '^[[:space:]]*([#;]|$)' /etc/darkroom/worker.ini"
  solution: |
    ```bash
    grep -vE '^[[:space:]]*([#;]|$)' /etc/darkroom/worker.ini          # show the real settings
    grep -vcE '^[[:space:]]*([#;]|$)' /etc/darkroom/worker.ini         # count them
    ```
    This is the #1 trick for reading long config files: `grep -vE '^\s*(#|$)' /etc/ssh/sshd_config`.

- id: d-grep-todo-files
  skill: text-processing
  difficulty: 1
  persona: tom
  channel: backend
  host: app01
  title: How many files have TODOs?
  message: "lol how many files under /srv/code on app01 contain 'TODO'? (files, not lines)"
  setup: |
    rm -rf /srv/code && mkdir -p /srv/code/{api,web,lib}
    for i in $(seq 30); do f=/srv/code/$(shuf -n1 -e api web lib)/mod_$i.py; echo "def f$i(): pass" > $f; [ $((RANDOM % 3)) = 0 ] && { echo "# TODO: fix this" >> $f; echo "# TODO: and this" >> $f; }; done
  expect: "grep -rl TODO /srv/code | wc -l"
  answer: number
  extract: "the number of files"
  hints:
    - "grep can search recursively and print only file names."
    - "`grep -r` recursive, `-l` list matching files once each."
    - "grep -rl TODO /srv/code | wc -l"
  solution: |
    ```bash
    grep -rl TODO /srv/code | wc -l     # files
    grep -rc TODO /srv/code | grep -v ':0$'   # per-file counts
    ```

- id: d-grep-before-panic
  skill: text-processing
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: Request right before the panic
  message: "@dhan there's exactly one 'panic' in /var/log/darkroom/service.log on app01. what's the req= id on the line right BEFORE it?"
  setup: |
    f=/var/log/darkroom/service.log; : > $f; n=$((RANDOM % 300 + 50))
    for i in $(seq 400); do echo "12:00:$((i%60)) handled req=r$(printf %05x $((RANDOM*7+i)))"; [ $i = $n ] && echo "12:00:$((i%60)) panic: nil pointer dereference"; done >> $f
  expect: "grep -B1 panic /var/log/darkroom/service.log | head -1 | grep -o 'req=[^ ]*' | cut -d= -f2"
  answer: regex
  extract: "the request id"
  secret: "The request id is {{EXPECT}} (the user may include or omit the 'req=' prefix)."
  hints:
    - "grep can show context lines around a match."
    - "`-B N` = N lines Before, `-A` After, `-C` both."
    - "grep -B1 panic /var/log/darkroom/service.log"
  solution: |
    ```bash
    grep -B1 panic /var/log/darkroom/service.log
    grep -C3 panic /var/log/darkroom/service.log     # more context
    ```

- id: d-grep-whole-word
