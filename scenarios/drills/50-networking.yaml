# ---------------------------------------------------------------- firewall

- id: d-nft-block-ip
  skill: firewall
  difficulty: 2
  persona: sam
  channel: platform
  host: web01
  title: Block a scanner on web01
  message: "@dhan 10.10.1.66 is hammering web01 with a vuln scanner. block ALL traffic from that IP on web01 with nftables. nobody else should notice anything"
  setup: |
    nft delete table inet filter 2>/dev/null
    runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 jump01 'sudo ip addr del 10.10.1.66/24 dev eth0' 2>/dev/null; true
  checks:
    - - |
        ! runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 jump01 'sudo ip addr add 10.10.1.66/24 dev eth0 2>/dev/null; curl -s -m3 -o /dev/null --interface 10.10.1.66 http://web01.darkroom.internal/; rc=$?; sudo ip addr del 10.10.1.66/24 dev eth0; exit $rc'
      - "a client at 10.10.1.66 can still reach web01"
    - ["runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 jump01 'curl -s -m3 -o /dev/null http://web01.darkroom.internal/'", "the rest of the office (jump01) can't reach web01 anymore, or can't SSH to it"]
    - ["curl -s -m5 -o /dev/null -w '%{http_code}' http://localhost/api/health | grep -qx 200", "web01's own /api/health broke"]
  solve: |
    nft add table inet filter
    nft add chain inet filter input '{ type filter hook input priority 0; policy accept; }'
    nft add rule inet filter input ip saddr 10.10.1.66 drop
  cleanup: |
    nft delete table inet filter 2>/dev/null
    runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 jump01 'sudo ip addr del 10.10.1.66/24 dev eth0' 2>/dev/null; true
  hints:
    - "You need a table, an input chain hooked into the kernel (with policy accept, so everyone else gets in), and one drop rule."
    - "`nft add table inet filter`, `nft add chain inet filter input '{ type filter hook input priority 0; policy accept; }'`, then `nft add rule ... ip saddr <ip> drop`."
    - "sudo nft add rule inet filter input ip saddr 10.10.1.66 drop   (after creating the table + chain)"
  solution: |
    ```bash
    sudo nft add table inet filter
    sudo nft add chain inet filter input '{ type filter hook input priority 0; policy accept; }'
    sudo nft add rule inet filter input ip saddr 10.10.1.66 counter drop
    sudo nft list ruleset          # the counter shows hits
    ```
    `drop` silently discards packets, and `reject` sends back an error. For scanners, drop is usual. This rule is runtime only (see d-nft-persist).

- id: d-nft-persist
  skill: firewall
  difficulty: 2
  persona: sam
  channel: platform
  host: web01
  title: Make the firewall block survive reboot
  message: "@dhan I blocked 10.10.1.66 on web01 by hand this morning with nft. make sure that block survives a reboot pls"
  setup: |
    [ -f /var/backups/nftables.conf.drill ] || cp /etc/nftables.conf /var/backups/nftables.conf.drill
    cp /var/backups/nftables.conf.drill /etc/nftables.conf; systemctl disable nftables >/dev/null 2>&1
    nft delete table inet filter 2>/dev/null
    nft add table inet filter; nft add chain inet filter input '{ type filter hook input priority 0; policy accept; }'
    nft add rule inet filter input ip saddr 10.10.1.66 drop
  checks:
    - ["grep -q '10.10.1.66' /etc/nftables.conf", "/etc/nftables.conf doesn't contain the block, so it's lost on reboot"]
    - ["nft -c -f /etc/nftables.conf", "/etc/nftables.conf doesn't parse (nft -c -f)"]
    - ["systemctl is-enabled -q nftables", "nftables.service isn't enabled, so the file is never loaded at boot"]
    - ["nft -f /etc/nftables.conf && nft list ruleset | grep -q 'ip saddr 10.10.1.66'", "loading /etc/nftables.conf doesn't produce the 10.10.1.66 rule"]
    - ["curl -s -m5 -o /dev/null -w '%{http_code}' http://localhost/api/health | grep -qx 200", "after loading /etc/nftables.conf, web01's /api/health broke"]
  solve: |
    { echo '#!/usr/sbin/nft -f'; echo 'flush ruleset'; nft list table inet filter; } > /etc/nftables.conf
    systemctl enable nftables >/dev/null 2>&1
  cleanup: |
    nft delete table inet filter 2>/dev/null
    [ -f /var/backups/nftables.conf.drill ] && cp /var/backups/nftables.conf.drill /etc/nftables.conf
    systemctl disable nftables >/dev/null 2>&1; true
  hints:
    - "Rules added with `nft add` live only in the kernel. At boot, nftables.service loads them from a file."
    - "Dump the live table into /etc/nftables.conf (keep a `flush ruleset` at the top), check it with `nft -c -f`, then enable the service."
    - "{ echo 'flush ruleset'; sudo nft list table inet filter; } | sudo tee /etc/nftables.conf; sudo systemctl enable nftables"
  solution: |
    ```bash
    sudo nft list ruleset                               # what's live now
    { echo '#!/usr/sbin/nft -f'; echo 'flush ruleset'; sudo nft list table inet filter; } | sudo tee /etc/nftables.conf
    sudo nft -c -f /etc/nftables.conf                   # syntax check, doesn't apply
    sudo systemctl enable nftables
    ```
    `flush ruleset` at the top makes reloading the file idempotent: no duplicate rules.

- id: d-db-firewall
  skill: firewall
  difficulty: 3
  persona: leah
  channel: netops
  host: db01
  title: Hardening broke postgres
  message: "@dhan my bad 😬 after my hardening on db01 the API can't reach postgres. open 5432 for the backend subnet 10.10.3.0/24 ONLY (office must stay blocked), keep policy drop, and make it persistent"
  setup: |
    [ -f /var/backups/nftables.conf.drill ] || cp /etc/nftables.conf /var/backups/nftables.conf.drill
    cat > /etc/nftables.conf <<'NFT'
    #!/usr/sbin/nft -f
    flush ruleset
    table inet filter {
      chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ip protocol icmp accept
        tcp dport 22 accept
      }
    }
    NFT
    nft -f /etc/nftables.conf; systemctl enable nftables >/dev/null 2>&1
  checks:
    - ["runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 app01 'timeout 3 bash -c \"</dev/tcp/10.10.3.20/5432\"'", "app01 still can't connect to db01:5432"]
    - ["! runuser -u dhan -- ssh -o BatchMode=yes -o ConnectTimeout=5 jump01 'timeout 3 bash -c \"</dev/tcp/10.10.3.20/5432\"'", "the office (jump01) can reach postgres now. backend only!"]
    - ["nft list chain inet filter input | grep -q 'policy drop'", "the input policy isn't drop anymore"]
    - ["nft -c -f /etc/nftables.conf && grep -q 5432 /etc/nftables.conf && systemctl is-enabled -q nftables", "the live rule isn't in /etc/nftables.conf (or nftables isn't enabled), so it won't survive a reboot"]
  solve: |
    sed -i 's|^\(\s*\)tcp dport 22 accept|&\n\1ip saddr 10.10.3.0/24 tcp dport 5432 accept|' /etc/nftables.conf
    nft -f /etc/nftables.conf
  cleanup: |
    nft delete table inet filter 2>/dev/null
    [ -f /var/backups/nftables.conf.drill ] && cp /var/backups/nftables.conf.drill /etc/nftables.conf
    systemctl disable nftables >/dev/null 2>&1; true
  hints:
    - "The rule needs to match both the source subnet and the destination port. Put it in the file, then load the file."
    - "In /etc/nftables.conf's input chain: `ip saddr <subnet> tcp dport <port> accept`. Then `nft -c -f` and `nft -f`."
    - "add `ip saddr 10.10.3.0/24 tcp dport 5432 accept` to the input chain in /etc/nftables.conf, then sudo nft -f /etc/nftables.conf"
  solution: |
    ```bash
    sudo nft list ruleset                           # policy drop, only 22 open
    sudoedit /etc/nftables.conf                     # add to chain input:
    #   ip saddr 10.10.3.0/24 tcp dport 5432 accept
    sudo nft -c -f /etc/nftables.conf && sudo nft -f /etc/nftables.conf
    # from app01:  pg_isready -h db01      -> accepting connections
    # from jump01: nc -zv -w3 db01 5432    -> timeout
    ```
    Editing the file and loading it keeps the live rules and the boot config identical.

