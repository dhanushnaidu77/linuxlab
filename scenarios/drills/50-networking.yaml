# Habit drills: addresses & routes, DNS, sockets, nftables, tcpdump, TLS.
# Cross-host setup/checks go through `runuser -u dhan -- ssh <host>` (shared lab key, passwordless sudo).

# ---------------------------------------------------------------- ip-routing

- id: d-find-secondary-ip
  skill: ip-routing
  difficulty: 1
  persona: leah
  channel: netops
  host: app01
  title: Undocumented second IP
  message: "@dhan someone added a second IP to app01 for the new metrics vhost and didn't document it 🙄 what is it?"
  setup: |
    for a in $(ip -4 -o addr show dev eth0 | awk '{print $4}' | grep -v '^10\.10\.3\.10/'); do ip addr del $a dev eth0; done
    ip addr add 10.10.3.$((RANDOM % 80 + 100))/24 dev eth0
  expect: "ip -4 -o addr show dev eth0 | awk '{print $4}' | cut -d/ -f1 | grep -vx 10.10.3.10"
  answer: exact
  extract: "the IP address (without the /prefix)"
  cleanup: "for a in $(ip -4 -o addr show dev eth0 | awk '{print $4}' | grep -v '^10\\.10\\.3\\.10/'); do ip addr del $a dev eth0; done"
  hints:
    - "List the addresses on the interface; one of them isn't app01's usual 10.10.3.10."
    - "`ip -br a` gives one line per interface with every address on it."
    - "ip -4 -br addr show dev eth0"
  solution: |
    ```bash
    ip -br a                     # brief: iface, state, all addresses
    ip -4 addr show dev eth0     # full detail (secondary addrs are flagged "secondary")
    ```
    `ifconfig` only shows the primary address unless the secondary has a label. `ip` shows everything.

- id: d-add-secondary-ip
  skill: ip-routing
  difficulty: 1
  persona: leah
  channel: netops
  host: app01
  title: Add an address to app01
  message: "@dhan please add 10.10.3.15/24 to eth0 on app01 (for the new reporting vhost). keep the existing address obviously 😅"
  setup: "ip addr del 10.10.3.15/24 dev eth0 2>/dev/null; true"
  checks:
    - ["ip -4 -o addr show dev eth0 | grep -q ' 10.10.3.15/24 '", "10.10.3.15/24 isn't on eth0"]
    - ["ip -4 -o addr show dev eth0 | grep -q ' 10.10.3.10/24 '", "app01's main address 10.10.3.10 is gone!"]
    - ["ip route show default | grep -q 'via 10.10.3.1'", "app01's default route is gone"]
  solve: "ip addr add 10.10.3.15/24 dev eth0"
  cleanup: "ip addr del 10.10.3.15/24 dev eth0 2>/dev/null; true"
  hints:
    - "`ip addr` can add an address next to the existing one. It doesn't replace it."
    - "`ip addr add <ip>/<prefix> dev <iface>`. Check the interface name with `ip -br l`."
    - "sudo ip addr add 10.10.3.15/24 dev eth0"
  solution: |
    ```bash
    sudo ip addr add 10.10.3.15/24 dev eth0
    ip -br a                                   # both addresses now
    sudo ip addr del 10.10.3.15/24 dev eth0    # undo
    ```
    This is runtime only. On a real Ubuntu box, list both addresses under `addresses:` in `/etc/netplan/*.yaml` and run `netplan apply`.

- id: d-route-get
  skill: ip-routing
  difficulty: 2
  persona: leah
  channel: netops
  host: app01
  title: Which gateway for that network?
  vars:
    NET: { pick: [172.20.5, 172.20.9, 192.168.40, 192.168.77] }
  message: "@dhan sanity check for me: when app01 sends traffic to {{NET}}.25, which gateway IP does it go through?"
  setup: |
    ip route del $NET.0/24 2>/dev/null; ip route del ${NET%.*}.0.0/16 2>/dev/null
    g=$((RANDOM % 40 + 200)); ip route add ${NET%.*}.0.0/16 via 10.10.3.$((g - 100)); ip route add $NET.0/24 via 10.10.3.$g
  expect: "ip route get $NET.25 | grep -oP 'via \\K\\S+'"
  answer: exact
  extract: "the gateway IP"
  cleanup: "ip route del $NET.0/24 2>/dev/null; ip route del ${NET%.*}.0.0/16 2>/dev/null; true"
  hints:
    - "More than one route might cover that address. The most specific one (longest prefix) wins."
    - "Don't work it out by hand: `ip route get <ip>` asks the kernel which route it would actually use."
    - "ip route get {{NET}}.25"
  solution: |
    ```bash
    ip route                  # a /16 AND a /24 both cover the address
    ip route get {{NET}}.25   # the kernel's answer: the /24 wins (longest prefix match)
    ```
    `ip route get` is the fastest way to answer "which way would this packet go?". It also shows the source IP that would be used.

- id: d-add-static-route
  skill: ip-routing
  difficulty: 2
  persona: leah
  channel: netops
  host: app01
  title: Route to the partner network
  message: "@dhan app01 needs to reach the partner network 192.168.77.0/24. that goes through the partner VPN box at 10.10.3.254, NOT the default gateway. everything else stays as is"
  setup: "ip route del 192.168.77.0/24 2>/dev/null; true"
  checks:
    - ["ip route show 192.168.77.0/24 | grep -q 'via 10.10.3.254'", "there's no route for 192.168.77.0/24 via 10.10.3.254"]
    - ["ip route get 192.168.77.10 | grep -q 'via 10.10.3.254'", "traffic to 192.168.77.x still doesn't go via 10.10.3.254"]
    - ["ip route show default | grep -q 'via 10.10.3.1'", "the default route via rtr01 (10.10.3.1) is gone. that was supposed to stay!"]
  solve: "ip route add 192.168.77.0/24 via 10.10.3.254"
  cleanup: "ip route del 192.168.77.0/24 2>/dev/null; true"
  hints:
    - "You need a static route for that one network. Don't touch the default route."
    - "`ip route add <network>/<prefix> via <gateway>`"
    - "sudo ip route add 192.168.77.0/24 via 10.10.3.254"
  solution: |
    ```bash
    sudo ip route add 192.168.77.0/24 via 10.10.3.254
    ip route get 192.168.77.10     # verify: via 10.10.3.254
    ```
    To make it persist on Ubuntu, add it to netplan under `routes: [{to: 192.168.77.0/24, via: 10.10.3.254}]`.

- id: d-bogus-host-route
  skill: ip-routing
  difficulty: 2
  persona: marcus
  channel: platform
  host: web01
  title: Portal /api broken, app01 is fine
  message: "portal /api is throwing 502s. app01 itself is healthy, I checked. tom was 'testing routes' on web01 yesterday. fix it"
  setup: "ip route replace 10.10.3.10/32 via 10.10.2.99"
  checks:
    - ["! ip route show 10.10.3.10/32 | grep -q .", "web01 still has a host route for app01 (10.10.3.10/32)"]
    - ["curl -s -m5 -o /dev/null -w '%{http_code}' http://localhost/api/health | grep -qx 200", "http://localhost/api/health on web01 still doesn't return 200"]
    - ["ip route show default | grep -q 'via 10.10.2.1'", "web01's default route is gone"]
  solve: "ip route del 10.10.3.10/32"
  hints:
    - "web01 has a route that's more specific than the default route, and it only covers app01."
    - "Run `ip route get 10.10.3.10` on web01. Is that the router you'd expect?"
    - "sudo ip route del 10.10.3.10/32"
  solution: |
    ```bash
    ip route get 10.10.3.10        # via 10.10.2.99?? that host doesn't exist
    ip route                       # a /32 for app01 beats the default route
    sudo ip route del 10.10.3.10/32
    curl -s localhost/api/health
    ```
    A /32 host route overrides every broader route, which makes it a classic leftover from a test.

- id: d-blackholed-host
  skill: ip-routing
  difficulty: 2
  persona: kofi
  channel: platform
  host: app01
  title: One host unreachable from app01
  message: "hey @dhan 🙌 one of the lab hosts (web01, jump01 or db01) is unreachable from app01, but only from app01. which one? just the hostname"
  setup: |
    ip route flush type blackhole 2>/dev/null
    t=(10.10.2.10 10.10.1.10 10.10.3.20); ip route add blackhole ${t[$((RANDOM % 3))]}/32
  expect: |
    case $(ip route show type blackhole | awk '{print $2}' | cut -d/ -f1) in
      10.10.2.10) echo web01;; 10.10.1.10) echo jump01;; 10.10.3.20) echo db01;;
    esac
  answer: exact
  extract: "the short hostname (e.g. web01)"
  cleanup: "ip route flush type blackhole 2>/dev/null; true"
  hints:
    - "Ping each one, then look at app01's routing table for anything unusual."
    - "`ping -c1 -W1 <host>`. A route of type `blackhole` silently drops everything to that destination."
    - "for h in web01 jump01 db01; do ping -c1 -W1 $h >/dev/null && echo \"$h ok\" || echo \"$h FAIL\"; done; ip route show type blackhole"
  solution: |
    ```bash
    for h in web01 jump01 db01; do ping -c1 -W1 -q $h >/dev/null && echo "$h ok" || echo "$h FAIL"; done
    ip route show type blackhole       # the culprit
    ip route get 10.10.3.20            # "RTNETLINK answers: Invalid argument" = blackholed
    sudo ip route del blackhole 10.10.3.20/32   # the fix, if asked
    ```

- id: d-set-mtu
  skill: ip-routing
  difficulty: 1
  persona: leah
  channel: netops
  host: jump01
  title: Lower the MTU on jump01
  message: "@dhan the new VPN encapsulation eats 100 bytes per packet. set eth0 on jump01 to MTU 1400 pls"
  setup: "ip link set eth0 mtu 1500"
  checks:
    - ["ip link show eth0 | grep -q 'mtu 1400 '", "eth0's MTU isn't 1400"]
    - ["ip link show eth0 | grep -q 'state UP'", "eth0 is down!"]
  solve: "ip link set eth0 mtu 1400"
  cleanup: "ip link set eth0 mtu 1500"
  hints:
    - "MTU is a link (layer 2) property, so it's set with `ip link`, not `ip addr`."
    - "`ip link set dev <iface> mtu <n>`"
    - "sudo ip link set eth0 mtu 1400"
  solution: |
    ```bash
    ip link show eth0                  # mtu 1500
    sudo ip link set eth0 mtu 1400
    ping -M do -s 1372 -c1 rtr01       # 1372 + 28 header bytes = 1400: OK. -s 1373 would fail
    ```

