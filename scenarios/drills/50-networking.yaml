    w=(portal shop status docs); b=${w[$((RANDOM % 4))]}
    openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj /CN=web01.darkroom.internal \
      -addext "subjectAltName=DNS:web01.darkroom.internal,DNS:$A.darkroom.internal,DNS:$b.darkroom.internal" \
      -keyout $s/darkroom.key -out $s/darkroom.crt 2>/dev/null
    systemctl reload nginx; sleep 1
  expect: "echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -ext subjectAltName | grep -oP 'DNS:\\K[^,\\s]+'"
  answer: set
