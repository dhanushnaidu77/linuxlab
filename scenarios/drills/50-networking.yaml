  cleanup: |
    s=/etc/nginx/ssl; [ -f /var/backups/darkroom.crt.drill ] && { cp /var/backups/darkroom.crt.drill $s/darkroom.crt; cp /var/backups/darkroom.key.drill $s/darkroom.key; systemctl reload nginx; }; true
  hints:
    - "Browsers ignore the CN. The valid names are in the Subject Alternative Name (SAN) extension."
    - "Fetch the served cert with `openssl s_client`, then use `openssl x509 -noout -ext subjectAltName`."
    - "echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -ext subjectAltName"
  solution: |
    ```bash
    echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -ext subjectAltName
    # or the full dump:  ... | openssl x509 -noout -text | grep -A1 'Alternative Name'
    ```

- id: d-cert-key-mismatch
  skill: tls
  difficulty: 3
  persona: marcus
  channel: platform
  host: web01
  title: nginx down after a cert "renewal"
  message: "portal is down. nginx on web01 won't start since someone 'renewed' the cert this morning. fix it. a fresh self-signed cert for web01.darkroom.internal is fine for now"
  setup: |
    s=/etc/nginx/ssl; [ -f /var/backups/darkroom.crt.drill ] || { cp $s/darkroom.crt /var/backups/darkroom.crt.drill; cp $s/darkroom.key /var/backups/darkroom.key.drill; }
    cp /var/backups/darkroom.crt.drill $s/darkroom.crt; openssl genrsa -out $s/darkroom.key 2048 2>/dev/null
    systemctl restart nginx 2>/dev/null; true
  checks:
    - ["systemctl is-active -q nginx", "nginx isn't running"]
    - ["curl -sk -m5 -o /dev/null https://localhost/", "https://localhost/ on web01 doesn't answer"]
    - ["[ \"$(openssl x509 -noout -pubkey -in /etc/nginx/ssl/darkroom.crt | sha256sum)\" = \"$(openssl pkey -pubout -in /etc/nginx/ssl/darkroom.key | sha256sum)\" ]", "darkroom.crt and darkroom.key still don't match"]
  solve: |
    s=/etc/nginx/ssl
    openssl req -x509 -new -key $s/darkroom.key -days 365 -subj /CN=web01.darkroom.internal -out $s/darkroom.crt 2>/dev/null
    systemctl restart nginx; sleep 1
  cleanup: |
    s=/etc/nginx/ssl; [ -f /var/backups/darkroom.crt.drill ] && { cp /var/backups/darkroom.crt.drill $s/darkroom.crt; cp /var/backups/darkroom.key.drill $s/darkroom.key; systemctl restart nginx; }; true
  hints:
    - "`nginx -t` or the journal will tell you why it won't start."
    - "\"key values mismatch\" means the certificate's public key isn't the private key's. Compare `openssl x509 -pubkey` with `openssl pkey -pubout`."
    - "sudo openssl req -x509 -new -key /etc/nginx/ssl/darkroom.key -days 365 -subj /CN=web01.darkroom.internal -out /etc/nginx/ssl/darkroom.crt && sudo systemctl restart nginx"
  solution: |
    ```bash
    sudo nginx -t        # SSL_CTX_use_PrivateKey ... key values mismatch
    diff <(sudo openssl x509 -noout -pubkey -in /etc/nginx/ssl/darkroom.crt) \
         <(sudo openssl pkey -pubout -in /etc/nginx/ssl/darkroom.key)     # differ
    # new self-signed cert for the EXISTING key:
    sudo openssl req -x509 -new -key /etc/nginx/ssl/darkroom.key -days 365 \
         -subj /CN=web01.darkroom.internal -out /etc/nginx/ssl/darkroom.crt
    sudo nginx -t && sudo systemctl restart nginx
    ```
