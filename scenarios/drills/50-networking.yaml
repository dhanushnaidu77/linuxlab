  channel: platform
  host: web01
  title: Capture HTTP traffic to a file
  message: "grab me a packet capture of HTTP (tcp port 80) traffic on web01 in /var/tmp/web80.pcap. only port 80 in it, and it better actually contain packets"
  setup: "rm -f /var/tmp/web80.pcap"
  checks:
    - ["[ -s /var/tmp/web80.pcap ]", "/var/tmp/web80.pcap doesn't exist or is empty"]
    - ["[ $(tcpdump -nr /var/tmp/web80.pcap 'tcp port 80' 2>/dev/null | wc -l) -gt 0 ]", "the pcap has no port-80 packets in it"]
    - ["[ $(tcpdump -nr /var/tmp/web80.pcap 'not tcp port 80' 2>/dev/null | wc -l) -eq 0 ]", "the pcap contains non-port-80 traffic. use a capture filter"]
  solve: |
    timeout 4 tcpdump -i any -w /var/tmp/web80.pcap 'tcp port 80' >/dev/null 2>&1 & sleep 1.5
    for i in 1 2 3; do curl -s -o /dev/null http://localhost/; done; wait
  cleanup: "rm -f /var/tmp/web80.pcap"
  hints:
    - "tcpdump can write raw packets to a file, and takes a filter expression that decides what's captured."
    - "`tcpdump -i any -w <file> 'tcp port 80'`. Generate some traffic in another terminal (curl), then Ctrl-C."
    - "sudo tcpdump -i any -w /var/tmp/web80.pcap 'tcp port 80'   (+ curl localhost in another shell)"
  solution: |
    ```bash
    sudo tcpdump -i any -w /var/tmp/web80.pcap 'tcp port 80'
    # other terminal:  curl -s localhost >/dev/null   (a few times), then Ctrl-C the capture
    tcpdump -nr /var/tmp/web80.pcap | head        # read it back
