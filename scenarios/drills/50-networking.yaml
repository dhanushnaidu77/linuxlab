- id: d-cert-days-left
  skill: tls
  difficulty: 2
  persona: sam
  channel: platform
  host: web01
  title: When does the cert expire?
  message: "@dhan how many days until the certificate served on web01:443 expires? for the renewal tracker"
  setup: |
    s=/etc/nginx/ssl; [ -f /var/backups/darkroom.crt.drill ] || { cp $s/darkroom.crt /var/backups/darkroom.crt.drill; cp $s/darkroom.key /var/backups/darkroom.key.drill; }
    openssl req -x509 -newkey rsa:2048 -nodes -days $((RANDOM % 110 + 10)) -subj /CN=web01.darkroom.internal -keyout $s/darkroom.key -out $s/darkroom.crt 2>/dev/null
    systemctl reload nginx; sleep 1
  expect: |
    end=$(echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
    echo $(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
  answer: number
  tolerance: 1
  extract: "the number of days"
  cleanup: |
    s=/etc/nginx/ssl; [ -f /var/backups/darkroom.crt.drill ] && { cp /var/backups/darkroom.crt.drill $s/darkroom.crt; cp /var/backups/darkroom.key.drill $s/darkroom.key; systemctl reload nginx; }; true
  hints:
    - "Look at the certificate the server actually serves, not just a file on disk."
    - "`openssl s_client -connect host:443` fetches it. Pipe that into `openssl x509 -noout -enddate`."
    - "echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -enddate"
  solution: |
    ```bash
    echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -dates
    end=$(echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
    echo $(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))     # days left
    openssl x509 -checkend $((30*86400)) -noout -in /etc/nginx/ssl/darkroom.crt   # "will it expire within 30d?"
    ```

- id: d-cert-sans
  skill: tls
  difficulty: 2
  persona: priya
  channel: platform
  host: web01
  title: Which names does the cert cover?
  vars:
    A: { random: word }
  message: "hi @dhan! the client asked which hostnames our web01 certificate is valid for 😅 can you list them? 🙏"
  setup: |
