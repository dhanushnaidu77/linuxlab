# ---------------------------------------------------------------- dns

- id: d-dig-new-record
  skill: dns
  difficulty: 1
  persona: tom
  channel: backend
  host: ns01
  title: What does the stage name resolve to?
  vars:
    W: { random: word }
  message: "what IP is `{{W}}-stage.darkroom.internal`? need it for a config lol"
  setup: |
    z=/etc/bind/db.darkroom.internal; o=/var/backups/db.darkroom.internal.drill
    [ -f $o ] || cp $z $o; cp $o $z
    echo "$W-stage IN A 10.10.3.$((RANDOM % 100 + 100))" >> $z
    sed -i 's/2026101501 ; serial/2026101502 ; serial/' $z; rndc reload darkroom.internal >/dev/null; sleep 1
  expect: "dig +short $W-stage.darkroom.internal @127.0.0.1"
  answer: exact
  extract: "the IP address"
  cleanup: "o=/var/backups/db.darkroom.internal.drill; [ -f $o ] && cp $o /etc/bind/db.darkroom.internal && rndc reload darkroom.internal >/dev/null; true"
  hints:
    - "Ask the DNS server directly. The record lives on ns01."
    - "`dig +short <name>` prints just the answer. `@server` picks which server to ask."
    - "dig +short {{W}}-stage.darkroom.internal"
  solution: |
    ```bash
    dig +short {{W}}-stage.darkroom.internal
    dig {{W}}-stage.darkroom.internal @ns01      # full answer: TTL, flags, which server replied
    getent hosts {{W}}-stage.darkroom.internal   # what apps see (also checks /etc/hosts)
    ```

- id: d-cname-chase
  skill: dns
  difficulty: 2
  persona: tom
  channel: backend
  host: ns01
  title: Where does the alias really point?
  vars:
    W: { random: word }
  message: "@dhan `{{W}}.darkroom.internal` is in our config but nobody knows which actual server it is. which host? (lab hostname)"
  setup: |
    z=/etc/bind/db.darkroom.internal; o=/var/backups/db.darkroom.internal.drill
    [ -f $o ] || cp $z $o; cp $o $z
    t=(web01 app01 db01); printf '%s IN CNAME svc-%s\nsvc-%s IN CNAME %s\n' $W $W $W ${t[$((RANDOM % 3))]} >> $z
    sed -i 's/2026101501 ; serial/2026101502 ; serial/' $z; rndc reload darkroom.internal >/dev/null; sleep 1
  expect: "dig +short $W.darkroom.internal @127.0.0.1 | grep -v '^[0-9]' | tail -1 | cut -d. -f1"
  answer: exact
  extract: "the short hostname (e.g. web01)"
  cleanup: "o=/var/backups/db.darkroom.internal.drill; [ -f $o ] && cp $o /etc/bind/db.darkroom.internal && rndc reload darkroom.internal >/dev/null; true"
  hints:
    - "The name is an alias (CNAME) for another name, which might itself be an alias."
    - "`dig +short` prints every step of the CNAME chain, then the final address."
    - "dig +short {{W}}.darkroom.internal"
  solution: |
    ```bash
    dig +short {{W}}.darkroom.internal
    # svc-{{W}}.darkroom.internal.   <- CNAME
    # <host>.darkroom.internal.      <- CNAME
    # 10.10.x.y                      <- the A record at the end of the chain
    dig +short -x 10.10.x.y          # confirm with a reverse lookup
    ```

- id: d-reverse-lookup
  skill: dns
  difficulty: 1
  persona: marcus
  channel: platform
  host: web01
  title: Who is that IP?
  vars:
    IP: { pick: [10.10.1.10, 10.10.3.10, 10.10.3.20, 10.10.3.53] }
  message: "{{IP}} is all over web01's nginx logs this morning. which machine is that. hostname"
  expect: "dig +short -x $IP | cut -d. -f1"
  answer: exact
  extract: "the short hostname"
  hints:
    - "That's a reverse lookup: IP to name, using a PTR record."
    - "`dig -x <ip>` builds the in-addr.arpa query for you."
    - "dig +short -x {{IP}}"
  solution: |
    ```bash
    dig +short -x {{IP}}
    host {{IP}}
    getent hosts {{IP}}
    ```
    Reverse zones are written backwards: 10.10.3.20 is `20.3.10.10.in-addr.arpa`.

- id: d-zone-typo
  skill: dns
  difficulty: 3
  persona: tom
  channel: backend
  host: ns01
  title: New DNS record never shows up
  message: "@dhan I added `metrics.darkroom.internal` (→ app01, 10.10.3.10) on ns01 like an hour ago and it STILL doesn't resolve. I reloaded bind and everything ngl"
  setup: |
    z=/etc/bind/db.darkroom.internal; o=/var/backups/db.darkroom.internal.drill
    [ -f $o ] || cp $z $o; cp $o $z
    echo 'metrics IN A 10.10.3.1O' >> $z
    sed -i 's/2026101501 ; serial/2026101502 ; serial/' $z; rndc reload darkroom.internal >/dev/null 2>&1; sleep 1
  checks:
    - ["dig +short metrics.darkroom.internal @127.0.0.1 | grep -qx 10.10.3.10", "metrics.darkroom.internal doesn't resolve to 10.10.3.10 yet"]
    - ["named-checkzone darkroom.internal /etc/bind/db.darkroom.internal", "the zone file still doesn't pass named-checkzone"]
    - ["dig +short app01.darkroom.internal @127.0.0.1 | grep -qx 10.10.3.10", "the rest of the zone broke (app01 doesn't resolve)"]
  solve: "sed -i 's/10\\.10\\.3\\.1O/10.10.3.10/' /etc/bind/db.darkroom.internal; rndc reload darkroom.internal; sleep 1"
  cleanup: "o=/var/backups/db.darkroom.internal.drill; [ -f $o ] && cp $o /etc/bind/db.darkroom.internal && rndc reload darkroom.internal >/dev/null; true"
  hints:
    - "When a reload fails, BIND keeps serving the OLD zone, so the reload can 'succeed' from Tom's point of view. Check the file itself."
    - "`named-checkzone <zone> <file>` tells you exactly which line is wrong. `journalctl -u named` shows the reload error too."
    - "named-checkzone darkroom.internal /etc/bind/db.darkroom.internal   then fix the line, bump the serial, sudo rndc reload"
  solution: |
    ```bash
    sudo named-checkzone darkroom.internal /etc/bind/db.darkroom.internal
    # ...: metrics IN A 10.10.3.1O: bad dotted quad   <- letter O, not zero
    sudo vim /etc/bind/db.darkroom.internal     # fix it, and bump the serial
    sudo rndc reload darkroom.internal
    dig +short metrics.darkroom.internal @localhost
    ```
    Always run `named-checkzone` before `rndc reload`.

- id: d-search-domain
  skill: dns
  difficulty: 2
  persona: marcus
  channel: platform
  host: web01
  title: Short names stopped resolving
  message: "on web01 `ping db01` says 'Name or service not known', but `ping db01.darkroom.internal` works. my scripts use short names. fix it"
  setup: "printf 'nameserver 10.10.3.53\\n' > /etc/resolv.conf"
  checks:
    - ["getent hosts db01 | grep -q 10.10.3.20", "short name db01 still doesn't resolve on web01"]
    - ["getent hosts app01.darkroom.internal | grep -q 10.10.3.10", "FQDNs stopped resolving on web01"]
  solve: "printf 'nameserver 10.10.3.53\\nsearch darkroom.internal\\n' > /etc/resolv.conf"
  cleanup: "printf 'nameserver 10.10.3.53\\nsearch darkroom.internal\\n' > /etc/resolv.conf"
  hints:
    - "Which file tells the resolver what domain to append to short names?"
    - "Look at /etc/resolv.conf. Compare it with another lab host's."
    - "add `search darkroom.internal` to /etc/resolv.conf"
  solution: |
    ```bash
    cat /etc/resolv.conf                 # nameserver only, no search line
    echo 'search darkroom.internal' | sudo tee -a /etc/resolv.conf
    getent hosts db01
    ```
    `dig db01` doesn't use the search list by default (`dig +search db01` does), so test with `getent` or `ping`.

- id: d-hosts-override
  skill: dns
  difficulty: 2
  persona: tom
  channel: backend
  host: app01
  title: DNS is right but the app disagrees
  message: "@dhan the api on app01 says the db is down. but `dig db01.darkroom.internal` on app01 gives the right IP?? wtf"
  setup: |
    grep -q '10.10.3.99' /etc/hosts || echo '10.10.3.99   db01.darkroom.internal db01   # temp: db migration test' >> /etc/hosts
  checks:
    - ["getent hosts db01.darkroom.internal | awk '{print $1}' | grep -qx 10.10.3.20", "app01 still resolves db01.darkroom.internal to the wrong IP"]
    - ["curl -s -m5 localhost:8080/health | grep -q '\"db\": \"up\"'", "the API's /health still reports db down"]
    - ["grep -q localhost /etc/hosts", "/etc/hosts lost its localhost entry. only remove the bad line!"]
  solve: "grep -v '10.10.3.99' /etc/hosts > /tmp/hosts.new; cat /tmp/hosts.new > /etc/hosts; rm -f /tmp/hosts.new"
  cleanup: "grep -v '10.10.3.99' /etc/hosts > /tmp/hosts.new; cat /tmp/hosts.new > /etc/hosts; rm -f /tmp/hosts.new"
  hints:
    - "`dig` only talks to DNS. Applications use the system resolver, which checks something else first."
    - "Compare `dig +short db01.darkroom.internal` with `getent hosts db01.darkroom.internal`. Then look at /etc/nsswitch.conf and /etc/hosts."
    - "remove the 10.10.3.99 line from /etc/hosts (sudoedit /etc/hosts)"
  solution: |
    ```bash
    dig +short db01.darkroom.internal       # 10.10.3.20 (DNS)
    getent hosts db01.darkroom.internal     # 10.10.3.99 (what apps actually get)
    grep hosts /etc/nsswitch.conf           # hosts: files dns  -> /etc/hosts wins
    sudoedit /etc/hosts                     # delete the stale line
    curl -s localhost:8080/health
    ```
    In containers /etc/hosts is bind-mounted, so `sed -i` fails with "Device or resource busy". Edit it in place instead (vim, or `cat new > /etc/hosts`).

# ---------------------------------------------------------------- ports-sockets

- id: d-port-of-process
  skill: ports-sockets
  difficulty: 1
  persona: kofi
  channel: platform
  host: app01
  title: Which port is the agent on?
  message: "hey @dhan 🙌 the `metrics-agent` process on app01 listens on a TCP port nobody wrote down. which port is it?"
  setup: |
    pkill -x metrics-agent; pkill -x stats-relay
    printf '#!/usr/bin/python3\nimport sys, http.server as h\nh.HTTPServer(("", int(sys.argv[1])), h.BaseHTTPRequestHandler).serve_forever()\n' > /usr/local/bin/metrics-agent
    cp /usr/local/bin/metrics-agent /usr/local/bin/stats-relay; chmod 755 /usr/local/bin/metrics-agent /usr/local/bin/stats-relay
    setsid -f /usr/local/bin/metrics-agent $((RANDOM % 1000 + 9000)) >/dev/null 2>&1 < /dev/null
    setsid -f /usr/local/bin/stats-relay $((RANDOM % 1000 + 7000)) >/dev/null 2>&1 < /dev/null; sleep 0.7
  expect: "ss -Hltnp | grep '\"metrics-agent\"' | awk '{print $4}' | awk -F: '{print $NF}'"
  answer: number
  extract: "the port number"
  cleanup: "pkill -x metrics-agent; pkill -x stats-relay; rm -f /usr/local/bin/metrics-agent /usr/local/bin/stats-relay"
  hints:
    - "List the listening sockets along with the process that owns each one."
    - "`ss -ltnp`: l=listening, t=tcp, n=numeric, p=process (needs sudo to see other users' processes)."
    - "sudo ss -ltnp | grep metrics-agent"
  solution: |
    ```bash
    sudo ss -ltnp | grep metrics-agent
    sudo lsof -iTCP -sTCP:LISTEN -P -n | grep metrics
    ```

- id: d-count-connections
  skill: ports-sockets
  difficulty: 2
  persona: marcus
  channel: platform
  host: web01
  title: Open connections to the API
  message: "how many ESTABLISHED tcp connections does web01 have to the api (app01:8080) right now. a number"
  setup: |
    pkill -x keepalive-probe
    printf '#!/usr/bin/python3\nimport socket, time\ns = socket.create_connection(("10.10.3.10", 8080))\ntime.sleep(1800)\n' > /usr/local/bin/keepalive-probe; chmod 755 /usr/local/bin/keepalive-probe
    n=$((RANDOM % 6 + 2)); for i in $(seq $n); do setsid -f /usr/local/bin/keepalive-probe >/dev/null 2>&1 < /dev/null; done
    for i in $(seq 50); do [ $(ss -Htn state established '( dst 10.10.3.10 and dport = :8080 )' | wc -l) -ge $n ] && break; sleep 0.1; done
  expect: "ss -Htn state established '( dst 10.10.3.10 and dport = :8080 )' | wc -l"
  answer: number
  extract: "the number of connections"
  cleanup: "pkill -x keepalive-probe; rm -f /usr/local/bin/keepalive-probe"
  hints:
    - "`ss` can filter by TCP state and by destination."
    - "`ss -tn state established` plus a filter like `'( dst <ip> and dport = :<port> )'`. Count lines with -H (no header) | wc -l."
    - "ss -Htn state established '( dst 10.10.3.10 and dport = :8080 )' | wc -l"
  solution: |
    ```bash
    ss -Htn state established '( dst 10.10.3.10 and dport = :8080 )' | wc -l
    ss -tnp state established dst 10.10.3.10     # and which processes own them (sudo)
    ```

- id: d-bind-localhost
  skill: ports-sockets
  difficulty: 2
  persona: sam
  channel: platform
  host: app01
  title: Internal service exposed on all interfaces
  message: "@dhan the `inventory` service on app01 (port 9100) listens on ALL interfaces. it must only be reachable from app01 itself. fix it in the service config, not with a firewall"
  setup: |
    mkdir -p /srv/inventory && echo ok > /srv/inventory/index.html
    echo 'BIND=0.0.0.0' > /etc/default/inventory
    printf '[Unit]\nDescription=Darkroom inventory endpoint\n[Service]\nEnvironmentFile=/etc/default/inventory\nExecStart=/usr/bin/python3 -m http.server --bind ${BIND} --directory /srv/inventory 9100\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/inventory.service
    systemctl daemon-reload; systemctl enable inventory >/dev/null 2>&1; systemctl restart inventory; sleep 1
  checks:
    - ["ss -Hltn 'sport = :9100' | awk '{print $4}' | grep -qx '127.0.0.1:9100'", "nothing is listening on 127.0.0.1:9100"]
    - ["! ss -Hltn 'sport = :9100' | awk '{print $4}' | grep -vqx '127.0.0.1:9100'", "port 9100 is still listening on a non-loopback address"]
    - ["systemctl is-active -q inventory", "the inventory service isn't running"]
    - ["grep -q '^BIND=127.0.0.1' /etc/default/inventory || systemctl cat inventory | grep -q 'bind 127.0.0.1'", "the fix isn't in the service config (it won't survive a restart)"]
  solve: "sed -i 's/^BIND=.*/BIND=127.0.0.1/' /etc/default/inventory; systemctl restart inventory; sleep 1"
  cleanup: "systemctl disable --now inventory >/dev/null 2>&1; rm -f /etc/systemd/system/inventory.service /etc/default/inventory; rm -rf /srv/inventory; systemctl daemon-reload"
  hints:
    - "`0.0.0.0` means every interface. Find where the service gets that address from."
    - "`systemctl cat inventory` shows the ExecStart line and its EnvironmentFile."
    - "set BIND=127.0.0.1 in /etc/default/inventory, then sudo systemctl restart inventory"
  solution: |
    ```bash
    ss -ltn 'sport = :9100'               # 0.0.0.0:9100
    systemctl cat inventory               # EnvironmentFile=/etc/default/inventory, --bind ${BIND}
    sudo sed -i 's/^BIND=.*/BIND=127.0.0.1/' /etc/default/inventory
    sudo systemctl restart inventory
    ss -ltn 'sport = :9100'               # 127.0.0.1:9100
    ```

