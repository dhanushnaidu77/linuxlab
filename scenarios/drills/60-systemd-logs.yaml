- id: l-count-errors-since
  skill: logs
  difficulty: 1
  persona: ana
  channel: data
  host: app01
  title: Errors since the deploy
  vars:
    SINCE: { from_setup: true }
  message: "@dhan how many ERROR messages has payment-sync logged on app01 since the deploy at {{SINCE}} UTC? it logs to the journal"
  setup: |
    mkdir -p /var/lib/lab-drill; s=$(date +%H:%M); echo "$s" > /var/lib/lab-drill/l-count-errors-since; echo "SINCE=$s"
    for i in $(seq $((RANDOM % 15 + 25))); do
      case $((RANDOM % 4)) in
        0) logger -t payment-sync "ERROR card processor timeout (batch $i)";;
        1) logger -t payment-api "ERROR upstream 502 on /charge";;
        *) logger -t payment-sync "INFO processed batch $i";;
      esac
    done; sleep 1
  expect: "journalctl -q -t payment-sync --since \"$(cat /var/lib/lab-drill/l-count-errors-since)\" -o cat | grep -c ERROR"
  answer: number
  extract: "the number of errors"
  hints:
    - "The journal can filter by the program's identifier (tag) and by time."
    - "`journalctl -t payment-sync --since HH:MM`. Count with grep -c. Careful: payment-api is a different program."
    - "journalctl -t payment-sync --since {{SINCE}} | grep -c ERROR"
  solution: |
    ```bash
    journalctl -t payment-sync --since {{SINCE}} -o cat | grep -c ERROR
    journalctl -t payment-sync --since {{SINCE}} -g ERROR    # -g = grep inside journalctl
    ```
    `-t` matches SYSLOG_IDENTIFIER (what `logger -t` sets). `-u` matches a systemd unit.

- id: l-priority-filter
