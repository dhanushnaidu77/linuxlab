- id: l-failure-reason
  skill: logs
  difficulty: 1
  persona: tom
  channel: backend
  host: app01
  title: Why does etl-loader fail?
  message: "etl-loader on app01 fails right away when it starts. what's it complaining about? I think it's missing some config file, which one?"
  setup: |
    f=/etc/etl/$(shuf -n1 -e sources mappings warehouse credentials schedule).yaml
    printf '# drill\n[Unit]\nDescription=ETL loader\n[Service]\nExecStart=/bin/sh -c "echo etl-loader starting; echo FATAL: cannot open %s: No such file or directory >&2; exit 1"\n' $f > /etc/systemd/system/etl-loader.service
    systemctl daemon-reload; systemctl reset-failed etl-loader 2>/dev/null; systemctl start etl-loader 2>/dev/null; sleep 1
  expect: "journalctl -q -u etl-loader -o cat | grep -oP 'cannot open \\K[^:]+' | tail -1"
  answer: exact
  extract: "the file path"
  cleanup: "systemctl reset-failed etl-loader 2>/dev/null; rm -f /etc/systemd/system/etl-loader.service; systemctl daemon-reload"
  hints:
    - "A service's stdout/stderr go to the journal."
    - "`journalctl -u etl-loader`. `-e` jumps to the end, `-n 20` shows the last 20 lines."
    - "journalctl -u etl-loader -n 20"
  solution: |
    ```bash
    systemctl status etl-loader        # last few lines, often enough
    journalctl -u etl-loader -n 20     # more context
    journalctl -u etl-loader -p err    # only stderr / error-level lines
    ```

- id: l-who-restarted
  skill: logs
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: Who restarted the API?
  vars:
    U: { random: user }
  message: "someone just restarted darkroom-api on app01 with sudo, in the middle of a deploy. who. username"
  setup: |
    for u in $U carlos-d hana-k; do id $u >/dev/null 2>&1 || useradd -m -s /bin/bash $u; done
    printf '%s ALL=(root) NOPASSWD: /usr/bin/systemctl, /usr/bin/journalctl\n' $U carlos-d hana-k > /etc/sudoers.d/lab-drill; chmod 440 /etc/sudoers.d/lab-drill
    runuser -u carlos-d -- sudo /usr/bin/journalctl -n1 >/dev/null 2>&1
    runuser -u $U -- sudo /usr/bin/systemctl restart darkroom-api
    runuser -u hana-k -- sudo /usr/bin/systemctl status darkroom-api >/dev/null 2>&1; sleep 1
  expect: "journalctl -q _COMM=sudo -o cat | grep 'COMMAND=/usr/bin/systemctl restart darkroom-api' | tail -1 | awk '{print $1}'"
  answer: exact
  extract: "the username"
  cleanup: "rm -f /etc/sudoers.d/lab-drill"
  hints:
    - "sudo logs every command it runs, including who ran it."
    - "Filter the journal on the sudo program: `journalctl _COMM=sudo` (or `-t sudo`). Look for the restart."
    - "journalctl _COMM=sudo | grep 'restart darkroom-api'"
  solution: |
    ```bash
    journalctl _COMM=sudo --since -1h | grep 'restart darkroom-api'
    #   <user> : PWD=/ ; USER=root ; COMMAND=/usr/bin/systemctl restart darkroom-api
    journalctl -u darkroom-api --since -1h       # when it actually restarted
    ```
    On boxes without journald, look in /var/log/auth.log.

- id: l-ssh-invalid-users
  skill: logs
  difficulty: 2
  persona: sam
  channel: platform
  host: web01
  title: Which usernames were tried over SSH?
  vars:
    SINCE: { from_setup: true }
  message: "@dhan someone has been trying to ssh into web01 with usernames that don't exist since {{SINCE}} UTC. which usernames did they try?"
  setup: |
    mkdir -p /var/lib/lab-drill; s=$(date +%H:%M); echo "$s" > /var/lib/lab-drill/l-ssh-invalid-users; echo "SINCE=$s"
    for u in $(shuf -n $((RANDOM % 3 + 3)) -e admin oracle test deploy postgres ubnt pi git ftpuser support); do
      for i in $(seq $((RANDOM % 3 + 1))); do timeout 5 ssh -n -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $u@localhost true >/dev/null 2>&1; done
    done; sleep 1
  expect: "journalctl -q -t sshd --since \"$(cat /var/lib/lab-drill/l-ssh-invalid-users)\" -o cat | grep -oP '^Invalid user \\K\\S+' | sort -u"
  answer: set
  extract: "the list of usernames"
  hints:
    - "sshd logs every login attempt for an account that doesn't exist."
    - "`journalctl -u ssh` (or `-t sshd`) since that time, then look for 'Invalid user'."
    - "journalctl -t sshd --since {{SINCE}} | grep 'Invalid user' | awk '{print $8}' | sort -u"
  solution: |
    ```bash
    journalctl -t sshd --since {{SINCE}} -o cat | grep '^Invalid user' | awk '{print $3}' | sort | uniq -c
    #   Invalid user oracle from 127.0.0.1 port 51234
    ```
    `-o cat` drops the timestamp/host prefix, so field numbers stay the same.

- id: l-persistent-journal
  skill: logs
  difficulty: 2
  persona: sam
  channel: platform
  host: db01
  title: Logs vanish on every reboot
  message: "@dhan db01 loses all its logs every time it reboots. which makes postmortems impossible. make the journal persistent"
  setup: |
    mkdir -p /etc/systemd/journald.conf.d; printf '[Journal]\nStorage=volatile\n' > /etc/systemd/journald.conf.d/50-lab.conf
    systemctl restart systemd-journald; rm -rf /var/log/journal; sleep 1
  checks:
    - ["! systemd-analyze cat-config systemd/journald.conf | grep -Eq '^Storage=(volatile|none)'", "journald is still configured with Storage=volatile"]
    - ["ls /var/log/journal/*/system.journal", "journald isn't writing to /var/log/journal (did you restart it?)"]
    - ["systemctl is-active -q systemd-journald", "journald isn't running"]
  solve: |
    rm -f /etc/systemd/journald.conf.d/50-lab.conf; mkdir -p /var/log/journal; systemd-tmpfiles --create --prefix /var/log/journal
    systemctl restart systemd-journald; journalctl --flush; sleep 1
  cleanup: |
    rm -f /etc/systemd/journald.conf.d/50-lab.conf; mkdir -p /var/log/journal; systemd-tmpfiles --create --prefix /var/log/journal
    systemctl restart systemd-journald; journalctl --flush
  hints:
    - "journald keeps logs in /run (RAM) or in /var/log/journal (disk), depending on its Storage= setting."
    - "`systemd-analyze cat-config systemd/journald.conf` shows the effective config, drop-ins included. With Storage=auto (the default), the /var/log/journal directory has to exist."
    - "remove the Storage=volatile drop-in, sudo mkdir -p /var/log/journal, sudo systemctl restart systemd-journald"
  solution: |
    ```bash
    systemd-analyze cat-config systemd/journald.conf | grep -v '^#'   # Storage=volatile (in a drop-in!)
    sudo rm /etc/systemd/journald.conf.d/50-lab.conf      # or set Storage=persistent
    sudo mkdir -p /var/log/journal && sudo systemd-tmpfiles --create --prefix /var/log/journal
    sudo systemctl restart systemd-journald
    journalctl --header | grep 'File path'                # /var/log/journal/...
    journalctl --list-boots                               # will now span reboots
    ```

- id: l-journal-size-cap
  skill: logs
  difficulty: 2
  persona: marcus
  channel: platform
  host: app01
  title: Cap the journal size
  message: "app01's journal has no size cap and the disk is small. limit the persistent journal to 100M. and it has to actually be in effect, not just in a file"
  setup: |
    rm -f /etc/systemd/journald.conf.d/*.conf; sed -i '/^SystemMaxUse=/d' /etc/systemd/journald.conf
    systemctl restart systemd-journald; sleep 1
  checks:
    - ["systemd-analyze cat-config systemd/journald.conf | grep -Eq '^SystemMaxUse=100M'", "SystemMaxUse=100M isn't in journald's config"]
    - ["journalctl -q -u systemd-journald --since -10min -o cat | grep -q 'max 100.0M'", "journald hasn't picked up the new limit (restart it)"]
  solve: |
    mkdir -p /etc/systemd/journald.conf.d; printf '[Journal]\nSystemMaxUse=100M\n' > /etc/systemd/journald.conf.d/size.conf
    systemctl restart systemd-journald; sleep 1
  cleanup: "rm -f /etc/systemd/journald.conf.d/size.conf; systemctl restart systemd-journald"
  hints:
    - "journald's disk limits live in journald.conf, or better in a drop-in under journald.conf.d/."
    - "`SystemMaxUse=100M` in a `[Journal]` section, then restart systemd-journald. It logs the new max when it starts."
    - "printf '[Journal]\\nSystemMaxUse=100M\\n' | sudo tee /etc/systemd/journald.conf.d/size.conf; sudo systemctl restart systemd-journald"
  solution: |
    ```bash
    sudo mkdir -p /etc/systemd/journald.conf.d
    printf '[Journal]\nSystemMaxUse=100M\n' | sudo tee /etc/systemd/journald.conf.d/size.conf
    sudo systemctl restart systemd-journald
    journalctl -u systemd-journald -n 5      # "System Journal ... is 8.0M, max 100.0M, ..."
    journalctl --disk-usage
    sudo journalctl --vacuum-size=100M       # shrink right now instead of waiting
    ```

- id: l-logger-tag
  skill: logs
  difficulty: 1
  persona: ana
  channel: data
  host: app01
  title: Make the backup script log to the journal
  message: "@dhan /opt/darkroom/backup.sh on app01 just echoes 'backup finished' into the void. can it log that to the journal with the tag `backup` instead, so we can alert on it?"
  setup: |
    printf '#!/bin/bash\ntar czf /var/tmp/darkroom-backup.tgz /etc/darkroom 2>/dev/null\necho "backup finished"\n' > /opt/darkroom/backup.sh; chmod 755 /opt/darkroom/backup.sh
  checks:
    - ["rm -f /var/tmp/darkroom-backup.tgz; /opt/darkroom/backup.sh >/dev/null 2>&1; sleep 1; journalctl -q -t backup --since -20s -o cat | grep -q 'backup finished'", "I ran backup.sh and nothing with tag 'backup' saying 'backup finished' showed up in the journal"]
    - ["[ -s /var/tmp/darkroom-backup.tgz ]", "backup.sh no longer creates the backup tarball"]
  solve: "sed -i 's/^echo \"backup finished\"$/logger -t backup \"backup finished\"/' /opt/darkroom/backup.sh"
  cleanup: "rm -f /opt/darkroom/backup.sh /var/tmp/darkroom-backup.tgz"
  hints:
    - "There's a standard command that sends a line to syslog/the journal from a shell script."
    - "`logger -t <tag> \"message\"`. Then check it with `journalctl -t <tag>`."
    - "replace the echo with: logger -t backup \"backup finished\""
  solution: |
    ```bash
    sudo sed -i 's/^echo "backup finished"$/logger -t backup "backup finished"/' /opt/darkroom/backup.sh
    sudo /opt/darkroom/backup.sh && journalctl -t backup -n 3
    # alternatives: logger -t backup -p user.err "backup FAILED"   (set a priority)
    #               some-cmd 2>&1 | systemd-cat -t backup          (pipe a whole command's output)
    ```
