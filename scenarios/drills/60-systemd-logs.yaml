  setup: |
    mkdir -p /var/lib/lab-drill; s=$(date +%H:%M); echo "$s" > /var/lib/lab-drill/l-priority-filter; echo "SINCE=$s"
    p=(debug info info notice warning err crit info)
    for i in $(seq $((RANDOM % 15 + 20))); do pr=${p[$((RANDOM % 8))]}; logger -t ledger-export -p user.$pr "row batch $i done"; done; sleep 1
  expect: "journalctl -q -t ledger-export -p warning --since \"$(cat /var/lib/lab-drill/l-priority-filter)\" -o cat | wc -l"
  answer: number
