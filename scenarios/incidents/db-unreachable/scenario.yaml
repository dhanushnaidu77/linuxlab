id: db-unreachable
title: API can't reach the database
skills: [incidents, firewall, ports-sockets]
difficulty: 4
channel: oncall-alerts
persona: alertbot
alert: true
targets: [db01, app01]
vars: {}
message: |
  [FIRING] DarkroomApiDbDown — app01 darkroom-api health reports db: down (db01:5432). @dhan
secret_context: |
  Two faults on db01: (1) postgresql.conf listen_addresses was changed to 'localhost' and postgres restarted, so it only listens on
  127.0.0.1; (2) someone added a live nftables input rule on db01 dropping tcp dport 5432. Both must be fixed for app01 to connect.
  (Fixing one still leaves the health check failing.)
hints:
  - "Test connectivity from app01 to db01:5432 (nc -zv). Then look at db01: is postgres listening, and on which address? Is anything filtering?"
  - "On db01: `sudo ss -ltnp | grep 5432` shows the bind address; `sudo nft list ruleset` shows host firewall rules."
  - "On db01: set listen_addresses = '*' in /etc/postgresql/16/main/postgresql.conf, sudo systemctl restart postgresql, and remove the 5432 drop rule (sudo nft flush ruleset or delete by handle)."
