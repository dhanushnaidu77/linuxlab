id: install-local-debs
title: Install darkroom-cli from local .debs
skills: [packages]
difficulty: 2
channel: backend
persona: tom
targets: [app01]
vars:
  VER: { pick: ["1.4.2", "1.5.0", "2.0.1"] }
message: |
  @dhan can you install darkroom-cli on app01? the .deb is in /var/cache/darkroom/ (no internet on that box).
  I tried `dpkg -i` and it yelled at me about dependencies 🤷
secret_context: |
  /var/cache/darkroom/ contains darkroom-cli_{{VER}}_all.deb which Depends on darkroom-common, also present as a .deb in the same
  directory. dpkg -i of only the cli fails with unmet dependencies and leaves it half-configured. Installing both together
  (dpkg -i *.deb, or apt install ./a.deb ./b.deb) works. `darkroom-cli --version` must print {{VER}}.
hints:
  - "Read the dpkg error carefully: what does darkroom-cli depend on, and is it available locally?"
  - "`dpkg -I <file.deb>` shows a package's metadata (Depends:). You can give dpkg several .deb files at once."
  - "sudo dpkg -i /var/cache/darkroom/*.deb && darkroom-cli --version"
