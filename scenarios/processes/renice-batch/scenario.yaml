id: renice-batch
title: Make the batch job play nice
skills: [processes]
difficulty: 2
channel: data
persona: ana
targets: [app01]
vars: {}
message: |
  @dhan my reindex job on app01 is eating all the CPU and the API is getting sluggish. please DON'T kill it, it's been running
  for 3 hours and has to finish tonight. can you make it lower priority so everything else gets CPU first?
secret_context: |
  A CPU-bound process "reindex" (bash busy loop script) runs at nice 0. Correct: renice it to a high nice value (≥ 10, ideally 19)
  keeping the same PID. Killing/restarting it fails the task.
hints:
  - "Linux has a 'niceness' value per process that affects CPU scheduling priority."
  - "`renice` changes the niceness of a running process (higher = lower priority, max 19). Find the PID first."
  - "sudo renice -n 19 -p $(pgrep -x reindex)"
