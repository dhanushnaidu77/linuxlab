id: expired-cert
title: Portal certificate expired
skills: [tls]
difficulty: 3
channel: platform
persona: priya
targets: [web01]
vars: {}
message: |
  @dhan the internal portal https://web01.kestrel.internal shows a big red "certificate expired" warning 😱 the client demo
  is in 2 hours… can you renew it? the self-signed one is fine, it just needs to be valid (for a year ideally)
secret_context: |
  nginx on web01 uses /etc/nginx/ssl/kestrel.crt + kestrel.key; the cert expired on 2025-02-01. Fix: generate a new self-signed cert
  (CN=web01.kestrel.internal, valid ≥ 30 days, ideally 365) at the same paths (or update nginx config), then reload nginx.
  Priya only sees the browser warning.
hints:
  - "Check the dates on the certificate nginx is serving. `openssl s_client` + `openssl x509 -noout -dates`."
  - "Find the cert path in the nginx site config, create a new self-signed cert with `openssl req -x509 ... -days 365`, then reload nginx."
  - "sudo openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=web01.kestrel.internal -keyout /etc/nginx/ssl/kestrel.key -out /etc/nginx/ssl/kestrel.crt && sudo nginx -t && sudo systemctl reload nginx"
